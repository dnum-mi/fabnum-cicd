# The OCI registry is this workflow's only distribution channel, and unlike
# release-helm.yml there is no input to turn it off. In a monorepo the GitHub
# Releases and git tags belong to the application, so the chart cannot claim
# them for its own packages - which rules out the tgz-on-release + index.yaml
# channel that chart-releaser offers there. Disabling the OCI push would
# therefore leave this workflow with nothing to publish.
name: Release chart (local)

on:
  workflow_call:
    inputs:
      CHARTS_DIR:
        description: Directory containing the Helm charts
        type: string
        required: false
        default: ./charts
      CHART_NAME:
        description: >-
          Chart directory under CHARTS_DIR to package and push (e.g. 'my-app'
          for CHARTS_DIR/my-app). Leave empty to package every chart found
          directly under CHARTS_DIR.
        type: string
        required: false
      CHART_VERSION:
        description: >-
          Chart version to stamp when packaging (helm package --version).
          Defaults to the version already set in Chart.yaml. Applies to every
          chart packaged in this run.
        type: string
        required: false
      APP_VERSION:
        description: >-
          Application version to stamp when packaging
          (helm package --app-version). Defaults to the appVersion already set
          in Chart.yaml. Applies to every chart packaged in this run.
        type: string
        required: false
      CHECKOUT_REF:
        description: >-
          Git ref (branch or SHA) to check out before packaging. Use it to
          pick up a chart bump commit pushed earlier in the same pipeline
          (e.g. the 'commit-sha' output of update-helm-chart.yml in local
          mode). Defaults to the commit that triggered the workflow.
        type: string
        required: false
      HELM_REPOS:
        description: Helm repositories to add (name=url, comma-separated)
        type: string
        required: false
      REGISTRY:
        description: OCI registry to push charts to (e.g. ghcr.io, registry.gitlab.com)
        type: string
        required: false
        default: ghcr.io
      REPOSITORY:
        description: Repository path in the OCI registry (defaults to github.repository)
        type: string
        required: false
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: >-
          Username for OCI registry authentication. Required when REGISTRY is
          not ghcr.io; for ghcr.io the workflow authenticates with the
          built-in GITHUB_TOKEN instead.
        required: false
      REGISTRY_PASSWORD:
        description: >-
          Password for OCI registry authentication. Required alongside
          REGISTRY_USERNAME under the same conditions.
        required: false

jobs:
  release:
    name: Release chart (local)
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      packages: write
    env:
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_REGISTRY_AUTH: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
    steps:
    - name: Validate inputs
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
      run: |
        set -euo pipefail

        # Only ghcr.io can fall back to the built-in GITHUB_TOKEN. Any other
        # registry needs explicit credentials; without them the login step
        # would pipe an empty password into `helm registry login` and fail
        # with an opaque authentication error instead of naming the cause.
        if [ "$REGISTRY" != "ghcr.io" ] && [ "$HAS_REGISTRY_AUTH" != "true" ]; then
          echo "::error::REGISTRY_USERNAME and REGISTRY_PASSWORD are required when REGISTRY ('$REGISTRY') is not ghcr.io."
          exit 1
        fi

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Empty ref = default checkout (the commit that triggered the run)
        ref: ${{ inputs.CHECKOUT_REF }}

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - name: Add Helm repos
      if: ${{ inputs.HELM_REPOS != '' }}
      env:
        HELM_REPOS: ${{ inputs.HELM_REPOS }}
      run: |
        for repo in $(echo "$HELM_REPOS" | tr ',' '\n'); do
          NAME="${repo%%=*}"
          URL="${repo#*=}"
          helm repo add "$NAME" "$URL"
        done
        helm repo update

    - name: Login to OCI Registry
      id: oci-login
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        USERNAME: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        PASSWORD: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      run: |
        set -euo pipefail

        echo "$PASSWORD" | helm registry login "$REGISTRY" -u "$USERNAME" --password-stdin

    - name: Package and push chart(s)
      env:
        CHARTS_DIR: ${{ inputs.CHARTS_DIR }}
        CHART_NAME: ${{ inputs.CHART_NAME }}
        CHART_VERSION: ${{ inputs.CHART_VERSION }}
        APP_VERSION: ${{ inputs.APP_VERSION }}
        REGISTRY: ${{ inputs.REGISTRY }}
        OCI_REPOSITORY: ${{ inputs.REPOSITORY }}
      run: |
        set -euo pipefail

        # Normalize inputs
        CHARTS_DIR="${CHARTS_DIR%/}"
        OCI_REPO="${OCI_REPOSITORY:-$GITHUB_REPOSITORY}"
        OCI_REPO=$(echo "$OCI_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')

        # Resolve which chart(s) to package: a single CHART_NAME, or every
        # immediate subdirectory of CHARTS_DIR that holds a Chart.yaml
        CHART_PATHS=()
        if [ -n "$CHART_NAME" ]; then
          CHART_PATHS+=("$CHARTS_DIR/$CHART_NAME")
        else
          while IFS= read -r dir; do
            CHART_PATHS+=("$dir")
          done < <(find "$CHARTS_DIR" -mindepth 1 -maxdepth 1 -type d | sort)
        fi

        mkdir -p .cr-release-packages
        PACKAGED=0
        for chart in "${CHART_PATHS[@]}"; do
          if [ ! -f "$chart/Chart.yaml" ]; then
            echo "Skipping '$chart' (no Chart.yaml)"
            continue
          fi

          # Pull dependencies only when the chart declares any
          if grep -q '^dependencies:' "$chart/Chart.yaml"; then
            echo "Updating dependencies for '$chart'"
            helm dependency update "$chart"
          fi

          PKG_ARGS=(--destination .cr-release-packages)
          [ -n "$CHART_VERSION" ] && PKG_ARGS+=(--version "$CHART_VERSION")
          [ -n "$APP_VERSION" ] && PKG_ARGS+=(--app-version "$APP_VERSION")

          echo "Packaging '$chart'"
          helm package "$chart" "${PKG_ARGS[@]}"
          PACKAGED=$((PACKAGED + 1))
        done

        if [ "$PACKAGED" -eq 0 ]; then
          echo "No chart with a Chart.yaml was found to package under '$CHARTS_DIR'"
          exit 1
        fi

        for chart_package in .cr-release-packages/*.tgz; do
          chart_file=$(basename "$chart_package")
          echo "Publishing ${chart_file} to oci://$REGISTRY/${OCI_REPO}"
          helm push "$chart_package" "oci://$REGISTRY/${OCI_REPO}"
        done

    # Helm stores registry credentials in the runner's Helm config, which on a
    # self-hosted runner (supported through RUNS_ON) outlives the job and would
    # otherwise stay readable by whatever runs next. Hosted runners are
    # ephemeral and do not care, but the cleanup costs one step either way.
    # `always()` so a failed push still clears them.
    - name: Logout from OCI Registry
      if: ${{ always() && steps.oci-login.outcome == 'success' }}
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
      run: |
        set -euo pipefail

        helm registry logout "$REGISTRY"
