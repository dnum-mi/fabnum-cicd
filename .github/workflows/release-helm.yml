name: Release

on:
  workflow_call:
    inputs:
      CHARTS_DIR:
        description: Directory containing the Helm charts
        type: string
        required: false
        default: ./charts
      CREATE_GITHUB_RELEASE:
        description: >-
          Additionally create a GitHub Release and git tag for each changed
          chart and update the Helm repo index.yaml on the pages branch. This
          requires the pages branch (see PAGES_BRANCH) to already exist. Left
          false (the default), the workflow only packages charts and pushes
          them to the OCI registry - no GitHub Pages branch required.
        type: boolean
        required: false
        default: false
      PAGES_BRANCH:
        description: >-
          Branch that receives the Helm repo index.yaml and release artifacts
          when CREATE_GITHUB_RELEASE is true. Must already exist in the repo.
        type: string
        required: false
        default: gh-pages
      HELM_REPOS:
        description: Helm repositories to add (name=url, comma-separated)
        type: string
        required: false
      REGISTRY:
        description: OCI registry to push charts to (e.g. ghcr.io, registry.gitlab.com)
        type: string
        required: false
        default: ghcr.io
      REPOSITORY:
        description: Repository path in the OCI registry (defaults to github.repository)
        type: string
        required: false
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username for OCI registry authentication
        required: false
      REGISTRY_PASSWORD:
        description: Password for OCI registry authentication
        required: false
      APP_CLIENT_ID:
        description: >-
          GitHub App Client ID (e.g. Iv23li..., NOT the numeric App ID). Supply
          with APP_PRIVATE_KEY to have chart-releaser authenticate as a GitHub
          App. Unlike GITHUB_TOKEN, the releases it creates can then fire
          'release:' triggers.
          See docs/workflows/authentication.md.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Required alongside APP_CLIENT_ID.
        required: false
      GH_PAT:
        description: >-
          Personal access token, used for the same purpose as the App
          credentials above and resolved after them. Like an App token it can
          trigger workflows, so the same caveat applies to the PAGES_BRANCH
          push.
        required: false

jobs:
  release:
    name: Release charts (chart-releaser)
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: write
      packages: write
    env:
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      # Exactly one of the two set: a typo or a half-finished setup. Never a
      # valid configuration, and silently falling back would downgrade auth.
      HAS_PARTIAL_APP_AUTH: ${{ (secrets.APP_CLIENT_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
    - name: Validate credentials
      run: |
        set -euo pipefail

        if [ "$HAS_PARTIAL_APP_AUTH" = "true" ]; then
          echo "::error::APP_CLIENT_ID and APP_PRIVATE_KEY must be supplied together, but only one was. Continuing would silently fall back to GH_PAT or GITHUB_TOKEN instead of authenticating as the App."
          exit 1
        fi

    # Only minted when chart-releaser actually creates GitHub Releases and
    # pushes the pages branch. With CREATE_GITHUB_RELEASE false, `cr` only
    # packages charts (skip_upload) and CR_TOKEN is never used for a write, so
    # there is nothing for a contents:write token to do.
    # Scoped to this repository only: passing `owner:` without `repositories:`
    # would widen the token to every repo in the installation.
    - name: Generate GitHub App token
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' && inputs.CREATE_GITHUB_RELEASE }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name github-actions[bot]
        git config user.email github-actions[bot]@users.noreply.github.com

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - name: Add Helm repos
      if: ${{ inputs.HELM_REPOS != '' }}
      env:
        HELM_REPOS: ${{ inputs.HELM_REPOS }}
      run: |
        for repo in $(echo "$HELM_REPOS" | tr ',' '\n'); do
          NAME="${repo%%=*}"
          URL="${repo#*=}"
          helm repo add "$NAME" "$URL"
        done
        helm repo update

    - name: Run chart-releaser
      id: chart-releaser
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
      with:
        version: v1.8.1
        charts_dir: ${{ inputs.CHARTS_DIR }}
        # skip_upload=true only packages charts (OCI-only); false additionally
        # creates GitHub Releases/tags and updates index.yaml on the pages branch
        skip_upload: ${{ !inputs.CREATE_GITHUB_RELEASE }}
        pages_branch: ${{ inputs.PAGES_BRANCH }}
      env:
        # `cr index --push` authenticates the PAGES_BRANCH push with this same
        # token, so under an App token that push can trigger workflows too - not
        # only the release creation this is added for. Safe as long as no caller
        # triggers on the pages branch; check before pointing one at it.
        #
        # GH_PAT is gated on CREATE_GITHUB_RELEASE for the same reason the App
        # token is not minted without it: with skip_upload, `cr` only packages
        # charts and never writes through this token, so both elevated
        # credentials resolve to GITHUB_TOKEN and neither adds trigger surface.
        CR_TOKEN: "${{ steps.app-token.outputs.token || (inputs.CREATE_GITHUB_RELEASE && secrets.GH_PAT) || secrets.GITHUB_TOKEN }}"

    - name: Login to OCI Registry
      if: steps.chart-releaser.outputs.changed_charts != ''
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        USERNAME: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        PASSWORD: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      run: |
        echo "$PASSWORD" | helm registry login "$REGISTRY" -u "$USERNAME" --password-stdin

    - name: Publish charts to OCI registry
      if: steps.chart-releaser.outputs.changed_charts != ''
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        OCI_REPOSITORY: ${{ inputs.REPOSITORY }}
      run: |
        # Determine OCI repository path
        OCI_REPO="$OCI_REPOSITORY"
        if [ -z "$OCI_REPO" ]; then
          OCI_REPO="$GITHUB_REPOSITORY"
        fi

        # Normalize OCI repository path: lowercase and replace _ with -
        OCI_REPO=$(echo "$OCI_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')

        # Only process charts that were actually released
        for chart_package in .cr-release-packages/*.tgz; do
          if [ ! -f "$chart_package" ]; then
            echo "No charts to publish"
            continue
          fi

          chart_file=$(basename "$chart_package")

          # Push to OCI registry
          echo "Publishing ${chart_file} to OCI registry..."
          helm push "$chart_package" "oci://$REGISTRY/$OCI_REPO"
        done
