name: Release

on:
  workflow_call:
    inputs:
      MODE:
        description: >-
          Release strategy. 'chart-releaser' (default) auto-detects charts whose
          version changed since the last git tag - best for a dedicated charts
          repository. 'local' packages a specific chart from this repo at an
          explicit version and pushes it to the OCI registry - best for a
          monorepo where the chart lives alongside application code and the
          shared tag namespace makes chart-releaser's change detection
          unreliable.
        type: string
        required: false
        default: chart-releaser
      CHARTS_DIR:
        description: Directory containing the Helm charts
        type: string
        required: false
        default: ./charts
      CREATE_GITHUB_RELEASE:
        description: >-
          Additionally create a GitHub Release and git tag for each changed
          chart and update the Helm repo index.yaml on the pages branch. This
          requires the pages branch (see PAGES_BRANCH) to already exist. Left
          false (the default), the workflow only packages charts and pushes
          them to the OCI registry - no GitHub Pages branch required.
        type: boolean
        required: false
        default: false
      PAGES_BRANCH:
        description: >-
          Branch that receives the Helm repo index.yaml and release artifacts
          when CREATE_GITHUB_RELEASE is true. Must already exist in the repo.
          (chart-releaser mode only.)
        type: string
        required: false
        default: gh-pages
      CHART_NAME:
        description: >-
          Local mode only. Chart directory under CHARTS_DIR to package and push
          (e.g. 'my-app' for CHARTS_DIR/my-app). Leave empty to package every
          chart found directly under CHARTS_DIR.
        type: string
        required: false
      CHART_VERSION:
        description: >-
          Local mode only. Chart version to stamp when packaging
          (helm package --version). Defaults to the version already set in
          Chart.yaml. Applies to every chart packaged in this run.
        type: string
        required: false
      APP_VERSION:
        description: >-
          Local mode only. Application version to stamp when packaging
          (helm package --app-version). Defaults to the appVersion already set
          in Chart.yaml. Applies to every chart packaged in this run.
        type: string
        required: false
      CHECKOUT_REF:
        description: >-
          Local mode only. Git ref (branch or SHA) to check out before
          packaging. Use it to pick up a chart bump commit pushed earlier in
          the same pipeline (e.g. the 'commit-sha' output of
          update-helm-chart.yml in local mode). Defaults to the commit that
          triggered the workflow.
        type: string
        required: false
      HELM_REPOS:
        description: Helm repositories to add (name=url, comma-separated)
        type: string
        required: false
      REGISTRY:
        description: OCI registry to push charts to (e.g. ghcr.io, registry.gitlab.com)
        type: string
        required: false
        default: ghcr.io
      REPOSITORY:
        description: Repository path in the OCI registry (defaults to github.repository)
        type: string
        required: false
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username for OCI registry authentication
        required: false
      REGISTRY_PASSWORD:
        description: Password for OCI registry authentication
        required: false

jobs:
  release:
    name: Release charts (chart-releaser)
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    if: ${{ inputs.MODE != 'local' }}
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name github-actions[bot]
        git config user.email github-actions[bot]@users.noreply.github.com

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - name: Add Helm repos
      if: ${{ inputs.HELM_REPOS != '' }}
      env:
        HELM_REPOS: ${{ inputs.HELM_REPOS }}
      run: |
        for repo in $(echo "$HELM_REPOS" | tr ',' '\n'); do
          NAME="${repo%%=*}"
          URL="${repo#*=}"
          helm repo add "$NAME" "$URL"
        done
        helm repo update

    - name: Run chart-releaser
      id: chart-releaser
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
      with:
        version: v1.8.1
        charts_dir: ${{ inputs.CHARTS_DIR }}
        # skip_upload=true only packages charts (OCI-only); false additionally
        # creates GitHub Releases/tags and updates index.yaml on the pages branch
        skip_upload: ${{ !inputs.CREATE_GITHUB_RELEASE }}
        pages_branch: ${{ inputs.PAGES_BRANCH }}
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    - name: Login to OCI Registry
      if: steps.chart-releaser.outputs.changed_charts != ''
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        USERNAME: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        PASSWORD: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      run: |
        echo "$PASSWORD" | helm registry login "$REGISTRY" -u "$USERNAME" --password-stdin

    - name: Publish charts to OCI registry
      if: steps.chart-releaser.outputs.changed_charts != ''
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        OCI_REPOSITORY: ${{ inputs.REPOSITORY }}
      run: |
        # Determine OCI repository path
        OCI_REPO="$OCI_REPOSITORY"
        if [ -z "$OCI_REPO" ]; then
          OCI_REPO="$GITHUB_REPOSITORY"
        fi

        # Normalize OCI repository path: lowercase and replace _ with -
        OCI_REPO=$(echo "$OCI_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')

        # Only process charts that were actually released
        for chart_package in .cr-release-packages/*.tgz; do
          if [ ! -f "$chart_package" ]; then
            echo "No charts to publish"
            continue
          fi

          chart_file=$(basename "$chart_package")

          # Push to OCI registry
          echo "Publishing ${chart_file} to OCI registry..."
          helm push "$chart_package" oci://$REGISTRY/${OCI_REPO}
        done

  release-local:
    name: Release chart (local)
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    if: ${{ inputs.MODE == 'local' }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Empty ref = default checkout (the commit that triggered the run)
        ref: ${{ inputs.CHECKOUT_REF }}

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - name: Add Helm repos
      if: ${{ inputs.HELM_REPOS != '' }}
      env:
        HELM_REPOS: ${{ inputs.HELM_REPOS }}
      run: |
        for repo in $(echo "$HELM_REPOS" | tr ',' '\n'); do
          NAME="${repo%%=*}"
          URL="${repo#*=}"
          helm repo add "$NAME" "$URL"
        done
        helm repo update

    - name: Login to OCI Registry
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        USERNAME: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        PASSWORD: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      run: |
        echo "$PASSWORD" | helm registry login "$REGISTRY" -u "$USERNAME" --password-stdin

    - name: Package and push chart(s)
      env:
        CHARTS_DIR: ${{ inputs.CHARTS_DIR }}
        CHART_NAME: ${{ inputs.CHART_NAME }}
        CHART_VERSION: ${{ inputs.CHART_VERSION }}
        APP_VERSION: ${{ inputs.APP_VERSION }}
        REGISTRY: ${{ inputs.REGISTRY }}
        OCI_REPOSITORY: ${{ inputs.REPOSITORY }}
      run: |
        set -euo pipefail

        # Normalize inputs
        CHARTS_DIR="${CHARTS_DIR%/}"
        OCI_REPO="${OCI_REPOSITORY:-$GITHUB_REPOSITORY}"
        OCI_REPO=$(echo "$OCI_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')

        # Resolve which chart(s) to package: a single CHART_NAME, or every
        # immediate subdirectory of CHARTS_DIR that holds a Chart.yaml
        CHART_PATHS=()
        if [ -n "$CHART_NAME" ]; then
          CHART_PATHS+=("$CHARTS_DIR/$CHART_NAME")
        else
          while IFS= read -r dir; do
            CHART_PATHS+=("$dir")
          done < <(find "$CHARTS_DIR" -mindepth 1 -maxdepth 1 -type d | sort)
        fi

        mkdir -p .cr-release-packages
        PACKAGED=0
        for chart in "${CHART_PATHS[@]}"; do
          if [ ! -f "$chart/Chart.yaml" ]; then
            echo "Skipping '$chart' (no Chart.yaml)"
            continue
          fi

          # Pull dependencies only when the chart declares any
          if grep -q '^dependencies:' "$chart/Chart.yaml"; then
            echo "Updating dependencies for '$chart'"
            helm dependency update "$chart"
          fi

          PKG_ARGS=(--destination .cr-release-packages)
          [ -n "$CHART_VERSION" ] && PKG_ARGS+=(--version "$CHART_VERSION")
          [ -n "$APP_VERSION" ] && PKG_ARGS+=(--app-version "$APP_VERSION")

          echo "Packaging '$chart'"
          helm package "$chart" "${PKG_ARGS[@]}"
          PACKAGED=$((PACKAGED + 1))
        done

        if [ "$PACKAGED" -eq 0 ]; then
          echo "No chart with a Chart.yaml was found to package under '$CHARTS_DIR'"
          exit 1
        fi

        for chart_package in .cr-release-packages/*.tgz; do
          chart_file=$(basename "$chart_package")
          echo "Publishing ${chart_file} to oci://$REGISTRY/${OCI_REPO}"
          helm push "$chart_package" "oci://$REGISTRY/${OCI_REPO}"
        done
