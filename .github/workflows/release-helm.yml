name: Release

on:
  workflow_call:
    inputs:
      CHARTS_DIR:
        description: Directory containing the Helm charts
        type: string
        required: false
        default: ./charts
      CREATE_GITHUB_RELEASE:
        description: >-
          Create a GitHub Release and git tag for each changed chart and update
          the Helm repo index.yaml on the pages branch, giving consumers a
          classic `helm repo add` repository. Requires the pages branch (see
          PAGES_BRANCH) to already exist. Independent of PUBLISH_OCI: the two
          are the workflow's two distribution channels and can be enabled
          separately or together, but at least one of them must be enabled.
          On by default: this workflow serves a dedicated chart repository,
          where the git tags belong to the charts and chart-releaser's classic
          output is the channel that repository shape exists for. Turn it off
          (and PUBLISH_OCI on) on a private repository or one with immutable
          releases - see docs/workflows/51-release-helm.md.
        type: boolean
        required: false
        default: true
      PAGES_BRANCH:
        description: >-
          Branch that receives the Helm repo index.yaml and release artifacts
          when CREATE_GITHUB_RELEASE is true. Must already exist in the repo.
        type: string
        required: false
        default: gh-pages
      PUBLISH_OCI:
        description: >-
          Package the changed charts and push them to the OCI registry
          (see REGISTRY/REPOSITORY). Independent of CREATE_GITHUB_RELEASE:
          the two are the workflow's two distribution channels and can be
          enabled separately or together. At least one of them must be
          enabled, otherwise the workflow would package charts and discard
          them - that combination fails the run rather than passing green
          having published nothing. Off by default, so a dedicated chart
          repository publishes through the classic channel alone unless it
          asks for OCI; release-helm-local.yml is the monorepo counterpart and
          publishes to OCI only.
        type: boolean
        required: false
        default: false
      SKIP_EXISTING:
        description: >-
          Leave a chart version that is already published as it is, instead of
          failing the run. chart-releaser picks up every chart that changed
          since the last tag, a change that does not bump the version included
          (a fixed README, a comment in values.yaml), so a dedicated chart
          repository meets this on ordinary merges. On the classic channel it
          is chart-releaser's own skip-existing; on the OCI channel the version
          is looked up in the registry first and, if found, not pushed again -
          and not listed in published-charts either, so attest-helm.yml has
          nothing to sign twice. Off by default, where an existing version
          fails the run on both channels: a consumer pins a chart by version
          and a signature is bound to the digest first pushed, so one version
          must never come to mean something else.
        type: boolean
        required: false
        default: false
      SIGN_CHART:
        description: >-
          GPG-sign each packaged chart, producing the .prov provenance file
          that `helm verify` and `helm install --verify` check. Requires
          CREATE_GITHUB_RELEASE, since the .prov is published as a release
          asset alongside the .tgz - `helm push` does not carry it to an OCI
          registry, where cosign signatures are the equivalent (see
          attest-helm.yml). Needs SIGNING_KEY_ID plus the GPG_PRIVATE_KEY and
          GPG_PASSPHRASE secrets.
        type: boolean
        required: false
        default: false
      SIGNING_KEY_ID:
        description: >-
          Identity of the GPG key to sign with, as it appears in the keyring
          (e.g. 'Jane Doe <jane@example.com>' or a key ID). Required when
          SIGN_CHART is true. Passed to chart-releaser as CR_KEY.
        type: string
        required: false
      HELM_REPOS:
        description: Helm repositories to add (name=url, comma-separated)
        type: string
        required: false
      REGISTRY:
        description: OCI registry to push charts to (e.g. ghcr.io, registry.gitlab.com)
        type: string
        required: false
        default: ghcr.io
      REPOSITORY:
        description: Repository path in the OCI registry (defaults to github.repository)
        type: string
        required: false
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: >-
          Username for OCI registry authentication. Required with
          PUBLISH_OCI when REGISTRY is not ghcr.io; for ghcr.io the workflow
          authenticates with the built-in GITHUB_TOKEN instead.
        required: false
      REGISTRY_PASSWORD:
        description: >-
          Password for OCI registry authentication. Required alongside
          REGISTRY_USERNAME under the same conditions.
        required: false
      APP_CLIENT_ID:
        description: >-
          GitHub App Client ID (e.g. Iv23li..., NOT the numeric App ID). Supply
          with APP_PRIVATE_KEY to have chart-releaser authenticate as a GitHub
          App. Unlike GITHUB_TOKEN, the releases it creates can then fire
          `release:` triggers.
          See docs/workflows/05-authentication.md.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Required alongside APP_CLIENT_ID.
        required: false
      GH_PAT:
        description: >-
          Personal access token, used for the same purpose as the App
          credentials above and resolved after them. Like an App token it can
          trigger workflows, so the same caveat applies to the PAGES_BRANCH
          push.
        required: false
      GPG_PRIVATE_KEY:
        description: >-
          ASCII-armored GPG private key used to sign chart packages. Required
          with SIGN_CHART, ignored otherwise.
        required: false
      GPG_PASSPHRASE:
        description: >-
          Passphrase for GPG_PRIVATE_KEY. Required alongside it; pass an empty
          value only if the key genuinely has no passphrase.
        required: false
    outputs:
      published-charts:
        description: >-
          JSON array of the charts pushed to the OCI registry, each entry
          `{name, version, repository, digest}`. repository and digest are kept
          apart so they can be fed straight to attest-helm.yml, which passes
          them on as cosign's subject and as the subject-name/subject-digest
          pair actions/attest-build-provenance expects. Empty array when
          PUBLISH_OCI is false or no chart changed. A version left alone
          because it was already published (SKIP_EXISTING) is not listed.
        value: ${{ jobs.release.outputs.published-charts }}

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release charts (chart-releaser)
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    outputs:
      published-charts: ${{ steps.publish.outputs.published-charts || '[]' }}
    permissions:
      contents: write
      # `permissions:` takes no expressions, so this is granted even with
      # PUBLISH_OCI false, where nothing uses it. Unavoidable in a single
      # workflow file; splitting the two channels apart just to narrow it
      # would double the file count for no real gain.
      packages: write
    env:
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      # Exactly one of the two set: a typo or a half-finished setup. Never a
      # valid configuration, and silently falling back would downgrade auth.
      HAS_PARTIAL_APP_AUTH: ${{ (secrets.APP_CLIENT_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
      HAS_REGISTRY_AUTH: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
      # Only the key is checked: an empty passphrase is legitimate for a key
      # that has none, so requiring both would reject a valid setup.
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
    - name: Validate inputs
      env:
        PUBLISH_OCI: ${{ inputs.PUBLISH_OCI }}
        CREATE_GITHUB_RELEASE: ${{ inputs.CREATE_GITHUB_RELEASE }}
        REGISTRY: ${{ inputs.REGISTRY }}
        SIGN_CHART: ${{ inputs.SIGN_CHART }}
        SIGNING_KEY_ID: ${{ inputs.SIGNING_KEY_ID }}
      run: |
        set -euo pipefail

        if [ "$HAS_PARTIAL_APP_AUTH" = "true" ]; then
          echo "::error::APP_CLIENT_ID and APP_PRIVATE_KEY must be supplied together, but only one was. Continuing would silently fall back to GH_PAT or GITHUB_TOKEN instead of authenticating as the App."
          exit 1
        fi

        # PUBLISH_OCI and CREATE_GITHUB_RELEASE are the two distribution
        # channels. With both off the run would package charts, publish them
        # nowhere and still report success - a green run that shipped nothing
        # is worse than a failed one, so this stops here. CREATE_GITHUB_RELEASE
        # defaults to true, so reaching this means a caller turned it off
        # without enabling the other channel.
        if [ "$PUBLISH_OCI" != "true" ] && [ "$CREATE_GITHUB_RELEASE" != "true" ]; then
          echo "::error::Nothing to publish: PUBLISH_OCI and CREATE_GITHUB_RELEASE are both false. CREATE_GITHUB_RELEASE is on by default, so it was explicitly disabled - re-enable it to attach charts to a GitHub Release and maintain index.yaml on the pages branch, or set PUBLISH_OCI to push them to an OCI registry instead."
          exit 1
        fi

        # Only ghcr.io can fall back to the built-in GITHUB_TOKEN. Any other
        # registry needs explicit credentials; without them the login step
        # would pipe an empty password into `helm registry login` and fail
        # with an opaque authentication error instead of naming the cause.
        if [ "$PUBLISH_OCI" = "true" ] && [ "$REGISTRY" != "ghcr.io" ] && [ "$HAS_REGISTRY_AUTH" != "true" ]; then
          echo "::error::REGISTRY_USERNAME and REGISTRY_PASSWORD are required when PUBLISH_OCI is true and REGISTRY ('$REGISTRY') is not ghcr.io."
          exit 1
        fi

        if [ "$SIGN_CHART" = "true" ]; then
          # The .prov file rides along as a GitHub Release asset. `helm push`
          # does not carry it to an OCI registry, so on the OCI channel alone
          # signing would produce a provenance file that nothing ever
          # publishes - silently, which is exactly the shape this workflow
          # refuses elsewhere. cosign covers the OCI side (attest-helm.yml).
          if [ "$CREATE_GITHUB_RELEASE" != "true" ]; then
            echo "::error::SIGN_CHART requires CREATE_GITHUB_RELEASE. The .prov provenance file is published as a GitHub Release asset; 'helm push' does not carry it to an OCI registry, so on the OCI channel alone it would be generated and discarded. Sign OCI artifacts with attest-helm.yml instead."
            exit 1
          fi

          if [ "$HAS_GPG_KEY" != "true" ]; then
            echo "::error::SIGN_CHART is true but the GPG_PRIVATE_KEY secret is empty. chart-releaser would fall back to producing unsigned packages."
            exit 1
          fi

          if [ -z "$SIGNING_KEY_ID" ]; then
            echo "::error::SIGN_CHART is true but SIGNING_KEY_ID is empty. It names which key in the keyring to sign with (chart-releaser's CR_KEY) and has no usable default."
            exit 1
          fi
        fi

    # Only minted when chart-releaser runs, which is when CREATE_GITHUB_RELEASE
    # is true: it creates the releases and pushes the pages branch. With it
    # false chart-releaser is not run at all, so there is nothing for a
    # contents:write token to do.
    # Scoped to this repository only: passing `owner:` without `repositories:`
    # would widen the token to every repo in the installation.
    - name: Generate GitHub App token
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' && inputs.CREATE_GITHUB_RELEASE }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        # chart-releaser pulls and pushes the pages branch through `origin`, and
        # git sends the credential this checkout persists in preference to the
        # token chart-releaser puts in the push URL: the persisted header goes
        # out, the URL's never does. So this has to be the token meant to push -
        # the same expression as CR_TOKEN below, which a test keeps in step -
        # not the job's default one, or an App token or GH_PAT would create the
        # releases while GITHUB_TOKEN pushed the pages branch.
        # With CREATE_GITHUB_RELEASE false nothing runs git against the remote,
        # so nothing is persisted.
        token: ${{ steps.app-token.outputs.token || (inputs.CREATE_GITHUB_RELEASE && secrets.GH_PAT) || github.token }}
        persist-credentials: ${{ inputs.CREATE_GITHUB_RELEASE }}

    - name: Configure Git
      run: |
        git config user.name github-actions[bot]
        git config user.email github-actions[bot]@users.noreply.github.com

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - name: Add Helm repos
      if: ${{ inputs.HELM_REPOS != '' }}
      env:
        HELM_REPOS: ${{ inputs.HELM_REPOS }}
      run: |
        for repo in $(echo "$HELM_REPOS" | tr ',' '\n'); do
          NAME="${repo%%=*}"
          URL="${repo#*=}"
          helm repo add "$NAME" "$URL"
        done
        helm repo update

    # chart-releaser signs through gpg's legacy keyring files, not the modern
    # keybox gpg 2.1+ writes by default, so the imported key is exported back
    # out into pubring.gpg/secring.gpg. This is what Helm's provenance
    # documentation calls for, and skipping it leaves `cr` unable to find the
    # key at all.
    #
    # The passphrase reaches gpg and `cr` through a file rather than an
    # argument: process arguments are world-readable on the runner, and
    # CR_PASSPHRASE_FILE is the only form chart-releaser accepts anyway.
    - name: Import signing key
      if: ${{ inputs.SIGN_CHART }}
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        set -euo pipefail

        # Written under RUNNER_TEMP rather than ~/.gnupg so the paths handed to
        # `cr` below are absolute: they come from ${{ runner.temp }} in a step
        # `env:` block, and a '~' there would reach chart-releaser unexpanded.
        umask 077

        # A dedicated gpg home, so the cleanup step can remove the imported
        # private key without touching any keyring a persistent self-hosted
        # runner already had in ~/.gnupg.
        export GNUPGHOME="$RUNNER_TEMP/gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"

        printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

        gpg --batch --yes --export > "$RUNNER_TEMP/pubring.gpg"
        printf '%s' "$GPG_PASSPHRASE" \
          | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --export-secret-keys > "$RUNNER_TEMP/secring.gpg"

        printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"

        # An empty secring means the export produced nothing, which `cr` would
        # not treat as fatal - it would package unsigned charts and succeed.
        if [ ! -s "$RUNNER_TEMP/secring.gpg" ]; then
          echo "::error::No secret key was exported to the legacy keyring. Check that GPG_PRIVATE_KEY is an ASCII-armored private key and that GPG_PASSPHRASE matches it."
          exit 1
        fi

    # Only when a GitHub Release is wanted. chart-releaser-action cannot be told
    # not to create one: cr.sh runs `cr upload` unconditionally (its skip_upload
    # input only skips the index update), so with CREATE_GITHUB_RELEASE false
    # the action would still publish a release and a tag per chart, and fail on
    # a repository with immutable releases. The OCI channel packages the charts
    # itself, in the step below.
    - name: Run chart-releaser
      id: chart-releaser
      if: ${{ inputs.CREATE_GITHUB_RELEASE }}
      uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9  # v1.8.0
      with:
        version: v1.9.0
        charts_dir: ${{ inputs.CHARTS_DIR }}
        # Either 'true' or empty, never 'false': cr.sh only tests whether the
        # value is non-empty, so the string 'false' would turn the skip ON.
        skip_existing: ${{ inputs.SKIP_EXISTING && 'true' || '' }}
        pages_branch: ${{ inputs.PAGES_BRANCH }}
      env:
        # Creates the releases through the API, and pushes the PAGES_BRANCH with
        # the credential the checkout persisted: the same token, which is why
        # the checkout is given this exact expression. Under an App token or
        # GH_PAT that push can trigger workflows too, not only the release
        # creation this is added for. Safe as long as no caller triggers on the
        # pages branch; check before pointing one at it.
        CR_TOKEN: "${{ steps.app-token.outputs.token || (inputs.CREATE_GITHUB_RELEASE && secrets.GH_PAT) || github.token }}"
        # chart-releaser reads its flags from CR_-prefixed variables. Left
        # false, the three below are ignored and `cr` packages unsigned.
        CR_SIGN: ${{ inputs.SIGN_CHART }}
        CR_KEY: ${{ inputs.SIGNING_KEY_ID }}
        CR_KEYRING: ${{ runner.temp }}/secring.gpg
        CR_PASSPHRASE_FILE: ${{ runner.temp }}/gpg-passphrase

    # The OCI channel on its own: no chart-releaser, so no release and no tag.
    # Finds the charts the way cr.sh does - everything under the charts
    # directory that differs from the latest tag, or from the first commit when
    # there is none - and leaves the same two things the OCI steps read from
    # chart-releaser: the packages under .cr-release-packages and
    # `changed_charts`. A chart that changed without a version bump is packaged
    # all the same; the registry check in the publish step decides what happens
    # to it. Signing needs a GitHub Release, so it is never asked for here.
    - name: Package the changed charts
      id: package
      if: ${{ !inputs.CREATE_GITHUB_RELEASE }}
      env:
        CHARTS_DIR: ${{ inputs.CHARTS_DIR }}
      run: |
        set -euo pipefail

        base=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || git rev-list --max-parents=0 --first-parent HEAD)

        # A charts directory of ./charts or charts/team is one or two path
        # components deep: a chart is the next one.
        depth=$(( $(tr / '\n' <<<"$CHARTS_DIR" | sed '/^\(\.\)*$/d' | wc -l) + 1 ))

        changed=()
        while IFS= read -r chart; do
          if [ -f "$chart/Chart.yaml" ]; then
            changed+=("$chart")
          fi
        done < <(git diff --find-renames --name-only "$base" -- "$CHARTS_DIR" | cut -d / -f "1-$depth" | sort -u)

        mkdir -p .cr-release-packages
        for chart in ${changed[@]+"${changed[@]}"}; do
          echo "Packaging chart '$chart'..."
          helm package "$chart" --dependency-update --destination .cr-release-packages
        done

        printf 'changed_charts=%s\n' "$(IFS=,; echo "${changed[*]-}")" >> "$GITHUB_OUTPUT"

    - name: Login to OCI Registry
      id: oci-login
      if: ${{ inputs.PUBLISH_OCI && (steps.chart-releaser.outputs.changed_charts || steps.package.outputs.changed_charts) != '' }}
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        USERNAME: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        PASSWORD: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      run: |
        set -euo pipefail

        echo "$PASSWORD" | helm registry login "$REGISTRY" -u "$USERNAME" --password-stdin

    - name: Publish charts to OCI registry
      id: publish
      if: ${{ inputs.PUBLISH_OCI && (steps.chart-releaser.outputs.changed_charts || steps.package.outputs.changed_charts) != '' }}
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
        OCI_REPOSITORY: ${{ inputs.REPOSITORY }}
        SKIP_EXISTING: ${{ inputs.SKIP_EXISTING }}
      run: |
        set -euo pipefail

        # Determine OCI repository path
        OCI_REPO="${OCI_REPOSITORY:-$GITHUB_REPOSITORY}"

        # Normalize OCI repository path: lowercase and replace _ with -
        OCI_REPO=$(echo "$OCI_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')

        # nullglob so an unmatched pattern yields an empty array rather than
        # the literal glob. The previous `[ ! -f "$chart_package" ] && continue`
        # form turned that case into a green run that published nothing, even
        # though chart-releaser had just reported changed charts - so an empty
        # set is an anomaly worth failing on, not a state to skip past.
        shopt -s nullglob
        CHART_PACKAGES=(.cr-release-packages/*.tgz)

        if [ ${#CHART_PACKAGES[@]} -eq 0 ]; then
          echo "::error::chart-releaser reported changed charts but produced no package in .cr-release-packages."
          exit 1
        fi

        # A version already in the registry is never pushed over: a consumer
        # pins a chart by version and attest-helm.yml signs the digest it was
        # first pushed with, so pushing again would silently change what that
        # version means and orphan its signature. chart-releaser packages
        # every chart that changed since the last tag, a change that does not
        # bump the version included, so meeting one is routine: with
        # SKIP_EXISTING it is left as it is, without it the run stops.
        #
        # Every package is checked before any is pushed, so a run cannot
        # publish half of its charts. Only a clear "not found" lets a push
        # through: any other answer (denied, rate limited, unreachable) says
        # nothing about the version.
        TO_PUSH=()
        for chart_package in "${CHART_PACKAGES[@]}"; do
          meta=$(helm show chart "$chart_package")
          # Top-level keys only: `dependencies:` is printed first and holds
          # indented name: and version: lines of its own.
          name=$(awk '/^name:/ { print $2; exit }' <<<"$meta" | tr -d "\"'")
          version=$(awk '/^version:/ { print $2; exit }' <<<"$meta" | tr -d "\"'")
          if [[ ! "$name" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || [[ ! "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]*)?$ ]]; then
            echo "::error::cannot read the name and version of $(basename "$chart_package")"
            exit 1
          fi

          if probe=$(helm show chart "oci://$REGISTRY/$OCI_REPO/$name" --version "$version" 2>&1); then
            if [ "$SKIP_EXISTING" = "true" ]; then
              echo "::notice::$name $version is already published at oci://$REGISTRY/$OCI_REPO; leaving it as it is."
              continue
            fi
            echo "::error::$name $version is already published at oci://$REGISTRY/$OCI_REPO; refusing to push over it (set SKIP_EXISTING to leave published versions alone)."
            exit 1
          fi
          if ! grep -q -i -E 'not found|manifest unknown|name unknown|404' <<<"$probe"; then
            echo "::error::cannot tell whether $name $version is published at oci://$REGISTRY/$OCI_REPO: $probe"
            exit 1
          fi

          TO_PUSH+=("$chart_package")
        done

        # Each entry is recorded from helm's own Pushed:/Digest: output rather
        # than rebuilt from the file name: '<name>-<version>.tgz' cannot be
        # split back reliably, because a prerelease version contains dashes of
        # its own ('my-chart-1.2.3-rc.1.tgz').
        PUBLISHED='[]'

        # The expansion form that stays defined for an empty array: with
        # SKIP_EXISTING every package can be a version already published, and
        # an older bash (a self-hosted runner) fails `set -u` on "${TO_PUSH[@]}".
        for chart_package in ${TO_PUSH[@]+"${TO_PUSH[@]}"}; do
          chart_file=$(basename "$chart_package")
          echo "Publishing $chart_file to oci://$REGISTRY/$OCI_REPO"
          push_output=$(helm push "$chart_package" "oci://$REGISTRY/$OCI_REPO" 2>&1 | tee /dev/stderr)

          pushed=$(printf '%s\n' "$push_output" | awk '/^Pushed:/ { print $2 }')
          digest=$(printf '%s\n' "$push_output" | awk '/^Digest:/ { print $2 }')

          # Downstream signing pins the digest, so a missing one has to fail
          # here rather than produce an entry that cosign cannot resolve.
          if [ -z "$pushed" ] || [ -z "$digest" ]; then
            echo "::error::Could not read the reference and digest of $chart_file back from 'helm push'."
            exit 1
          fi

          # repository and digest are kept apart rather than pre-joined:
          # actions/attest-build-provenance takes them as separate
          # subject-name/subject-digest inputs, exactly as attest-docker.yml
          # feeds it. Consumers that want one string join them with '@'.
          PUBLISHED=$(printf '%s' "$PUBLISHED" | jq -c \
            --arg name "${pushed##*/}" \
            --arg repository "${pushed%:*}" \
            --arg digest "$digest" \
            '. + [{
               name: ($name | split(":")[0]),
               version: ($name | split(":")[1]),
               repository: $repository,
               digest: $digest
             }]')
        done

        printf 'published-charts=%s\n' "$PUBLISHED" >> "$GITHUB_OUTPUT"
        printf 'Published %s chart(s)\n' "$(printf '%s' "$PUBLISHED" | jq 'length')"

    # Helm stores registry credentials in the runner's Helm config, which on a
    # self-hosted runner (supported through RUNS_ON) outlives the job and would
    # otherwise stay readable by whatever runs next. Hosted runners are
    # ephemeral and do not care, but the cleanup costs one step either way.
    # `always()` so a failed push still clears them.
    - name: Logout from OCI Registry
      if: ${{ always() && steps.oci-login.outcome == 'success' }}
      env:
        REGISTRY: ${{ inputs.REGISTRY }}
      run: |
        set -euo pipefail

        helm registry logout "$REGISTRY"

    # Same self-hosted-runner reasoning as the registry logout above: the
    # signing step leaves the private key in the gpg home and an exported
    # legacy keyring plus the plaintext passphrase under RUNNER_TEMP, all of
    # which would outlive the job. `always()` so a failed release still
    # clears them.
    - name: Remove signing material
      if: ${{ always() && inputs.SIGN_CHART }}
      run: |
        set -euo pipefail

        rm -f "$RUNNER_TEMP/pubring.gpg" "$RUNNER_TEMP/secring.gpg" "$RUNNER_TEMP/gpg-passphrase"
        rm -rf "$RUNNER_TEMP/gnupg"
