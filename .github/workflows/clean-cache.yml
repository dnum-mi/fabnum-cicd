name: Clean cache

on:
  workflow_call:
    inputs:
      PR_NUMBER:
        description: ID number of the pull request whose caches should be deleted
        required: false
        type: number
      BRANCH_NAME:
        description: Branch name whose caches should be deleted
        required: false
        type: string
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  cleanup-cache:
    name: Delete GitHub Actions cache
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      actions: write
    if: ${{ inputs.PR_NUMBER || inputs.BRANCH_NAME }}
    steps:
    - name: Clean cache for branch
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH_NAME: ${{ inputs.BRANCH_NAME }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
      run: |
        set -euo pipefail

        # A pull request's caches are scoped to refs/pull/<N>/merge, never to
        # refs/heads/<head branch> - that ref only holds caches written by a
        # workflow triggered on `push`. Callers routinely pass both PR_NUMBER
        # and BRANCH_NAME, so preferring one over the other silently skipped
        # half the caches: taking BRANCH_NAME first meant every PR cleanup
        # looked up a ref that never holds PR caches, found nothing, and
        # exited 0 reporting success while the caches accumulated forever.
        # Sweep every ref we were given instead of choosing between them.
        REFS=()
        [ -n "$PR_NUMBER" ] && REFS+=("refs/pull/$PR_NUMBER/merge")
        [ -n "$BRANCH_NAME" ] && REFS+=("$BRANCH_NAME")

        if [ "${#REFS[@]}" -eq 0 ]; then
          echo "Neither BRANCH_NAME nor PR_NUMBER provided"
          exit 1
        fi

        DELETED=0
        for BRANCH in "${REFS[@]}"; do
          echo "Fetching cache keys for ref: $BRANCH"
          CACHE_KEYS=$(gh cache list -R "$REPO" -r "$BRANCH" -L 100 | cut -f 1 || true)

          if [ -z "$CACHE_KEYS" ]; then
            echo "  No cache keys found"
            continue
          fi

          while IFS= read -r CACHE_KEY; do
            if [ -n "$CACHE_KEY" ]; then
              # Best-effort: a key can vanish between the list and the delete
              # (a concurrent run evicting it), which must not fail the job.
              if gh cache delete "$CACHE_KEY" -R "$REPO"; then
                DELETED=$((DELETED + 1))
              else
                echo "  Failed to delete cache key: $CACHE_KEY"
              fi
            fi
          done <<< "$CACHE_KEYS"
        done

        echo "Cache cleanup completed ($DELETED deleted)"
