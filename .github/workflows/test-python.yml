name: Test Python

on:
  workflow_call:
    inputs:
      WORKING_DIRECTORY:
        description: Directory of the Python project (where its pyproject.toml lives)
        required: false
        type: string
        default: "."
      PYTHON_VERSIONS:
        description: Python versions to test against, as a JSON array (e.g., '["3.11", "3.13"]'). One matrix leg per version
        required: false
        type: string
        default: '["3.13"]'
      INSTALL_COMMAND:
        description: >-
          Command installing the project and its dependencies (runs in
          WORKING_DIRECTORY). The default refuses a stale uv.lock instead of
          quietly rewriting it, so the lint and test tools the defaults below
          call must be in the project's dev dependency group.
        required: false
        type: string
        default: uv sync --locked
      LINT_COMMAND:
        description: Lint command (runs in WORKING_DIRECTORY). Leave empty to skip linting
        required: false
        type: string
        default: uv run ruff check .
      TEST_COMMAND:
        description: Test command (runs in WORKING_DIRECTORY). Leave empty to skip the tests
        required: false
        type: string
        default: uv run pytest -q
      BUILD:
        description: Build the package (sdist + wheel) and install the wheel in a clean environment
        required: false
        type: boolean
        default: false
      IMPORT_NAME:
        description: >-
          Module imported from the clean environment the wheel was installed
          in, to prove it is usable (e.g., my_package). Only read when BUILD is
          true; leave empty to skip the import.
        required: false
        type: string
        default: ""
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.PYTHON_VERSIONS) }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Validate inputs
      if: ${{ inputs.BUILD }}
      env:
        IMPORT_NAME: ${{ inputs.IMPORT_NAME }}
      run: |
        set -euo pipefail

        # The name is spliced into `python -c`, so anything but a dotted
        # identifier is refused rather than escaped.
        if [ -n "$IMPORT_NAME" ] && [[ ! "$IMPORT_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]]; then
          echo "::error::IMPORT_NAME must be a dotted Python module name, got '$IMPORT_NAME'"
          exit 1
        fi

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.WORKING_DIRECTORY }}/uv.lock

    - name: Install dependencies
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        INSTALL_COMMAND: ${{ inputs.INSTALL_COMMAND }}
        UV_PYTHON: ${{ matrix.python-version }}
      run: bash -eo pipefail -c "$INSTALL_COMMAND"

    - name: Lint
      if: ${{ inputs.LINT_COMMAND != '' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        LINT_COMMAND: ${{ inputs.LINT_COMMAND }}
        UV_PYTHON: ${{ matrix.python-version }}
      run: bash -eo pipefail -c "$LINT_COMMAND"

    - name: Test
      if: ${{ inputs.TEST_COMMAND != '' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        TEST_COMMAND: ${{ inputs.TEST_COMMAND }}
        UV_PYTHON: ${{ matrix.python-version }}
      run: bash -eo pipefail -c "$TEST_COMMAND"

    - name: Build the package
      if: ${{ inputs.BUILD }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        UV_PYTHON: ${{ matrix.python-version }}
      # --out-dir keeps dist/ next to the project even when it is a member of a
      # uv workspace, where uv would otherwise write it at the workspace root.
      run: uv build --out-dir dist

    # A wheel that builds can still be unusable once installed: a missing data
    # file, a package left out of the wheel. Installing it away from the source
    # tree is what catches that.
    - name: Install the wheel in a clean environment
      if: ${{ inputs.BUILD }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        IMPORT_NAME: ${{ inputs.IMPORT_NAME }}
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        set -euo pipefail

        venv="$RUNNER_TEMP/wheel-check"
        uv venv --python "$PYTHON_VERSION" "$venv"
        uv pip install --python "$venv" dist/*.whl

        if [ -n "$IMPORT_NAME" ]; then
          # Away from the source tree, so the import cannot be satisfied by it.
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$venv" uv run --active --no-project python -c "import $IMPORT_NAME; print('imported', $IMPORT_NAME.__name__)"
        fi
