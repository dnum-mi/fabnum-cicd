name: Test Python

on:
  workflow_call:
    inputs:
      WORKING_DIRECTORY:
        description: Directory of the Python project (where its pyproject.toml lives)
        required: false
        type: string
        default: "."
      PYTHON_VERSION:
        description: Python version the project is installed and tested with
        required: false
        type: string
        default: "3.13"
      INSTALL_COMMAND:
        description: >-
          Command installing the project and its dependencies (runs in
          WORKING_DIRECTORY). The default refuses a stale uv.lock instead of
          quietly rewriting it, so the test tools must be in the project's dev
          dependency group.
        required: false
        type: string
        default: uv sync --locked
      TEST_COMMAND:
        description: >-
          Complete test command (runs in WORKING_DIRECTORY). Coverage options,
          including a floor such as --cov-fail-under, belong in it.
        required: false
        type: string
        default: uv run pytest -q
      ARTIFACT_NAME:
        description: Name of the artifact uploaded from ARTIFACT_PATH (e.g., the coverage report)
        required: false
        type: string
        default: test-report
      ARTIFACT_PATH:
        description: >-
          Path, relative to WORKING_DIRECTORY, uploaded as an artifact even when
          the tests fail (e.g., htmlcov/ or junit.xml). Empty uploads nothing.
        required: false
        type: string
        default: ""
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.WORKING_DIRECTORY }}/uv.lock

    # A `bash -c` does not inherit the step shell's options, so -e and pipefail
    # are spelled out: without them a multi-line command, or one piped into
    # tee, stays green when its first line fails.
    - name: Install dependencies
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        INSTALL_COMMAND: ${{ inputs.INSTALL_COMMAND }}
      run: bash -eo pipefail -c "$INSTALL_COMMAND"

    - name: Test
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        TEST_COMMAND: ${{ inputs.TEST_COMMAND }}
      run: bash -eo pipefail -c "$TEST_COMMAND"

    - name: Upload the test report
      if: ${{ always() && inputs.ARTIFACT_PATH != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.ARTIFACT_NAME }}
        path: ${{ inputs.WORKING_DIRECTORY }}/${{ inputs.ARTIFACT_PATH }}
        if-no-files-found: warn
