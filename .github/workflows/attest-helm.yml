name: Attest chart

# Separate from release-helm.yml on purpose. Both capabilities below need
# `id-token: write`, and GitHub validates a reusable workflow's entire declared
# job graph against what the caller grants - so folding this into release-helm
# would force OIDC token minting on every caller, including the ones that never
# attest anything. Same reasoning that splits attest-docker.yml out of
# build-docker.yml. See docs/workflows/release-helm-local.md#pourquoi-un-workflow-séparé.
#
# The capability inputs mirror attest-docker.yml so an image and a chart are
# attested the same way. SBOM is deliberately absent: a chart's dependencies
# are subcharts and image references, and an SPDX document of that is not
# something consumers verify.

on:
  workflow_call:
    inputs:
      CHARTS:
        description: >-
          JSON array of charts to attest, as produced by the `published-charts`
          output of release-helm.yml: each entry
          `{name, version, repository, digest}`. An empty array is a no-op, so
          this can be wired up unconditionally.
        required: true
        type: string
      SIGN:
        description: Sign the chart digest with cosign keyless signing
        required: false
        default: false
        type: boolean
      PROVENANCE:
        description: >-
          Generate GitHub's standard SLSA build provenance attestation for the
          chart (records the calling workflow, repository and commit). Answers
          where a chart came from, which a signature on its own does not.
        required: false
        default: false
        type: boolean
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username used to login into the registry (not needed for ghcr.io)
        required: false
      REGISTRY_PASSWORD:
        description: Password used to login into the registry (not needed for ghcr.io)
        required: false

jobs:
  # Split out so the attesting job can fan out over the charts:
  # actions/attest-build-provenance takes a single subject, so several charts
  # mean several jobs rather than a loop inside one.
  prepare:
    name: Read charts to attest
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions: {}
    outputs:
      charts: ${{ steps.charts.outputs.CHARTS }}
      count: ${{ steps.charts.outputs.COUNT }}
      registry: ${{ steps.charts.outputs.REGISTRY }}
    steps:
    - name: Read charts to attest
      id: charts
      env:
        CHARTS: ${{ inputs.CHARTS }}
        SIGN: ${{ inputs.SIGN }}
        PROVENANCE: ${{ inputs.PROVENANCE }}
      run: |
        set -euo pipefail

        # Neither capability enabled would fan out a matrix of jobs that each
        # log in to a registry and do nothing - green, and indistinguishable
        # from a run that attested everything.
        if [ "$SIGN" != "true" ] && [ "$PROVENANCE" != "true" ]; then
          echo "::error::Nothing to attest: SIGN and PROVENANCE are both false. Enable SIGN for a cosign keyless signature, PROVENANCE for a SLSA build provenance attestation, or both."
          exit 1
        fi

        if ! printf '%s' "$CHARTS" | jq -e 'type == "array"' >/dev/null 2>&1; then
          echo "::error::CHARTS must be a JSON array, as produced by the 'published-charts' output of release-helm.yml. Received: $CHARTS"
          exit 1
        fi

        COUNT=$(printf '%s' "$CHARTS" | jq 'length')
        {
          echo "COUNT=$COUNT"
          echo "CHARTS=$(printf '%s' "$CHARTS" | jq -c '.')"
        } >> "$GITHUB_OUTPUT"

        if [ "$COUNT" -eq 0 ]; then
          echo "No chart to attest"
          exit 0
        fi

        # Every entry must carry a digest. Attesting a tag would bind the
        # signature to whatever that tag resolves to at verification time,
        # which is precisely the guarantee attestation is supposed to remove.
        if printf '%s' "$CHARTS" | jq -e 'any(.[]; (.digest // "") | startswith("sha256:") | not)' >/dev/null; then
          echo "::error::Every entry of CHARTS needs a 'digest' of the form sha256:... Pass the 'published-charts' output of release-helm.yml through unchanged."
          exit 1
        fi

        if printf '%s' "$CHARTS" | jq -e 'any(.[]; (.repository // "") == "")' >/dev/null; then
          echo "::error::Every entry of CHARTS needs a 'repository'. Pass the 'published-charts' output of release-helm.yml through unchanged."
          exit 1
        fi

        REGISTRY=$(printf '%s' "$CHARTS" | jq -r '.[0].repository | split("/")[0]')
        echo "REGISTRY=$REGISTRY" >> "$GITHUB_OUTPUT"

        if printf '%s' "$CHARTS" | jq -e --arg r "$REGISTRY" 'any(.[]; (.repository | split("/")[0]) != $r)' >/dev/null; then
          echo "::error::All charts must live in the same registry - a single login is performed per job. Found more than one in CHARTS."
          exit 1
        fi

  attest:
    name: Attest ${{ matrix.chart.name }} ${{ matrix.chart.version }}
    needs: prepare
    # Load-bearing, not a tidy-up: a matrix built from an empty array does not
    # skip the job, it fails it. This `if:` is what makes an empty CHARTS the
    # documented no-op rather than a red run.
    if: ${{ needs.prepare.outputs.count != '0' }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    strategy:
      # One chart failing must not hide the state of the others: a partial
      # result is what has to be diagnosed, and the job still fails overall.
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.charts) }}
    steps:
    - name: Login to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ needs.prepare.outputs.registry }}
        username: ${{ needs.prepare.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ needs.prepare.outputs.registry == 'ghcr.io' && github.token || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Install Cosign
      if: ${{ inputs.SIGN }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Sign chart
      # A Helm chart in an OCI registry is an ordinary OCI artifact, so this is
      # the same keyless flow attest-docker.yml uses for images: the job's OIDC
      # token is exchanged at Fulcio for a short-lived certificate, and the
      # signature plus certificate are logged in Rekor. No key at rest.
      if: ${{ inputs.SIGN }}
      env:
        REFERENCE: ${{ matrix.chart.repository }}@${{ matrix.chart.digest }}
      run: |
        set -euo pipefail

        cosign sign --yes "$REFERENCE"

    - name: Attest build provenance
      # Deliberately not gated on the signing step succeeding. Provenance is
      # what establishes where a chart was built and from what, so a signing
      # problem must never be the reason a chart ships without it.
      if: ${{ !cancelled() && inputs.PROVENANCE }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ matrix.chart.repository }}
        subject-digest: ${{ matrix.chart.digest }}
        push-to-registry: true
        # Matches attest-docker.yml: the attestation lives with the artifact in
        # the registry, and a storage record adds nothing a verifier reads.
        create-storage-record: false
