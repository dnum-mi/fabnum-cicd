name: Gitleaks scan

on:
  workflow_call:
    inputs:
      GITLEAKS_VERSION:
        description: Gitleaks version used to perform the scan
        required: false
        type: string
        # renovate: datasource=github-releases depName=gitleaks/gitleaks
        default: 8.30.1
      FORMAT:
        description: Format of the report (sarif, json, csv, junit)
        required: false
        type: string
        default: sarif
      LOG_OPTS:
        description: >-
          Revision range handed to `git log` for the scan. Defaults to the
          checked-out ref only; widen it (e.g. `--all`) to scan every branch.
        required: false
        type: string
        default: HEAD
      FAIL_ON_LEAKS:
        description: Whether to fail the workflow when leaks are detected
        required: false
        type: boolean
        default: true
      PR_NUMBER:
        description: Number of the pull request to post the scan summary comment on
        required: false
        type: string
      GITHUB_SECURITY_TAB:
        description: Whether to link to GitHub Security Tab in the PR comment
        required: false
        default: false
        type: boolean
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  secrets-scan:
    name: Scan git history for leaked secrets
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      security-events: write
    outputs:
      leaks: ${{ steps.scan.outputs.leaks }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Full history so gitleaks can scan every commit, not just the current tree
        fetch-depth: 0
        # No later step talks to the git remote, so the job's token need not
        # stay in .git/config while the rest of the job runs.
        persist-credentials: false

    - name: Install gitleaks
      env:
        GITLEAKS_VERSION: ${{ inputs.GITLEAKS_VERSION }}
      # The gitleaks CLI is MIT licensed - unlike the official gitleaks-action
      # which requires a GITLEAKS_LICENSE key for organization repositories
      run: |
        case "$(uname -m)" in
          x86_64) ARCH="x64" ;;
          aarch64 | arm64) ARCH="arm64" ;;
          *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        TMP_DIR="$(mktemp -d)"
        cd "${TMP_DIR}"
        curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"
        curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" gitleaks
        mkdir -p "${HOME}/.local/bin"
        install -m 0755 gitleaks "${HOME}/.local/bin/gitleaks"
        echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
        "${HOME}/.local/bin/gitleaks" version

    - name: Run gitleaks scan on git history
      id: scan
      env:
        FORMAT: ${{ inputs.FORMAT }}
        LOG_OPTS: ${{ inputs.LOG_OPTS }}
      # Exit code 1 means leaks were found, anything else above 0 is a scan error.
      # Leaks are reported but only fail the workflow in the last step, so the
      # report upload and the PR comment always run first.
      #
      # `--log-opts` is not optional here: `gitleaks git .` defaults to walking
      # every ref, and the checkout above fetches all of them (fetch-depth: 0).
      # Without it a secret on any unmerged branch fails this job on every pull
      # request in the repository, and a force-push there changes the finding's
      # commit - and therefore its fingerprint - breaking whatever allowlist was
      # keeping it quiet.
      run: |
        EXIT_CODE=0
        gitleaks git . \
          --log-opts "${LOG_OPTS}" \
          --report-format "${FORMAT}" \
          --report-path "gitleaks-results.${FORMAT}" \
          --redact \
          --no-banner \
          --verbose || EXIT_CODE=$?
        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "leaks=false" >> "$GITHUB_OUTPUT"
          echo ":white_check_mark: Gitleaks found no leaked secrets in the git history." >> "$GITHUB_STEP_SUMMARY"
        elif [ "${EXIT_CODE}" -eq 1 ]; then
          echo "leaks=true" >> "$GITHUB_OUTPUT"
          echo ":rotating_light: Gitleaks detected potential leaked secrets in the git history, see the scan report for details." >> "$GITHUB_STEP_SUMMARY"
        else
          echo ":warning: The gitleaks scan did not complete successfully (exit code ${EXIT_CODE})." >> "$GITHUB_STEP_SUMMARY"
          exit "${EXIT_CODE}"
        fi

    - name: Upload gitleaks scan results to GitHub Security tab
      id: upload
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      if: ${{ inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif' }}
      with:
        sarif_file: ${{ format('gitleaks-results.{0}', inputs.FORMAT) }}
      continue-on-error: true

    - name: Warn about error
      if: ${{ steps.upload.outcome == 'failure' }}
      run: |
        echo ":warning: The gitleaks scan report was not successfully uploaded to the Github Security Panel." >> "$GITHUB_STEP_SUMMARY"

    - name: Fail on detected leaks
      if: ${{ inputs.FAIL_ON_LEAKS && steps.scan.outputs.leaks == 'true' }}
      run: |
        echo "::error::Gitleaks detected potential leaked secrets in the git history."
        exit 1

  scan-notif:
    name: Notify users
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      pull-requests: write
    # The leaks output is only set when the scan completed (with or without
    # findings) - skip the comment when the scan itself errored
    if: ${{ always() && inputs.PR_NUMBER != '' && needs.secrets-scan.outputs.leaks != '' }}
    needs:
    - secrets-scan
    steps:
    - name: Build the report link
      id: report
      env:
        GITHUB_SECURITY_TAB: ${{ inputs.GITHUB_SECURITY_TAB }}
        FORMAT: ${{ inputs.FORMAT }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        REF: ${{ github.ref }}
      # Code scanning only finds the alerts under the ref the SARIF was uploaded
      # against, and that ref is `github.ref` - the same one for every job of
      # this run. A pull request lands under `refs/pull/<N>/merge`, which the
      # search matches as `pr:<N>`; anything pushed lands under
      # `refs/heads/<branch>`, which it matches as `branch:<name>`. Deriving the
      # filter from the ref instead of always assuming a pull request is what
      # keeps the link honest for a caller that scans on `push` and passes
      # PR_NUMBER by hand - there the alerts are on a branch and `pr:<N>` finds
      # nothing.
      run: |
        if [ "${GITHUB_SECURITY_TAB}" != "true" ] || [ "${FORMAT}" != "sarif" ]; then
          echo "link=[the GitHub Workflow Summary](https://github.com/${REPOSITORY}/actions/runs/${RUN_ID})" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Percent-encode everything outside the unreserved set: a branch name may
        # hold `#`, `&` or `+`, each of which would otherwise cut the query short
        # or decode back to a different name. Iterating under LC_ALL=C walks
        # bytes, so a non-ASCII name encodes to the UTF-8 sequence the search
        # expects rather than to a codepoint it cannot read.
        urlencode() {
          local LC_ALL=C string="$1" index char encoded=""
          for (( index = 0; index < ${#string}; index++ )); do
            char="${string:index:1}"
            case "${char}" in
              [a-zA-Z0-9.~_-]) encoded+="${char}" ;;
              *) printf -v char '%%%02X' "'${char}"; encoded+="${char}" ;;
            esac
          done
          printf '%s' "${encoded}"
        }

        case "${REF}" in
          refs/pull/*/merge | refs/pull/*/head)
            PR_REF="${REF#refs/pull/}"
            FILTER="+pr%3A$(urlencode "${PR_REF%%/*}")"
            ;;
          refs/heads/*)
            FILTER="+branch%3A$(urlencode "${REF#refs/heads/}")"
            ;;
          # A tag, or a ref shape that is none of the above: no ref filter beats
          # a wrong one, since the tab then lists every open alert rather than
          # none of them.
          *)
            FILTER=""
            ;;
        esac

        echo "link=[the GitHub Security Tab](https://github.com/${REPOSITORY}/security/code-scanning?query=is%3Aopen${FILTER})" >> "$GITHUB_OUTPUT"

    - name: Comment PR
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
      with:
        message: |
          🤖 Hey !

          ${{ needs.secrets-scan.outputs.leaks == 'true' && '🚨 Gitleaks detected potential leaked secrets in the git history.' || '✅ Gitleaks found no leaked secrets in the git history.' }} The secret scan report for the current pull request is available in ${{ steps.report.outputs.link }}.
        header: secret-scan
        # Not `number`: that one is only a fallback the event payload overrides,
        # and the caller naming a pull request has to be what decides.
        number_force: ${{ inputs.PR_NUMBER }}
