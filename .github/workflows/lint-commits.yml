name: Lint commits

on:
  workflow_call:
    inputs:
      COMMITS_SOURCE:
        description: Source of commits to lint ('pr' for PR commits, 'push' for pushed commits)
        type: string
        required: false
        default: "pr"
      CONFIG_FILE:
        description: Path to commitlint config file (if exists in repo)
        type: string
        required: false
        default: ""
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on linting errors
        type: boolean
        required: false
        default: true
      ALLOWED_TYPES:
        description: Comma-separated list of allowed commit types
        type: string
        required: false
        default: "feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert"
      REQUIRE_SCOPE:
        description: Whether to require a scope in commit messages
        type: boolean
        required: false
        default: false
      MAX_SUBJECT_LENGTH:
        description: >-
          Maximum length of the commit header - the whole first line, including
          the 'type(scope): ' prefix (commitlint's header-max-length rule).
        type: number
        required: false
        default: 100
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  lint-commits:
    name: Lint commit messages
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: latest

    # Exact versions, not ranges: this is third-party code executed in the
    # job, and 'latest' would let a new upstream release change what runs
    # here without any change on our side.
    - name: Install commitlint
      run: bun install @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1

    # The generated file is static program text: it reads the three
    # configuration values from the environment at lint time (see the env of
    # the 'Lint commits' step below), so no workflow input ever becomes part
    # of the JavaScript. Interpolating them here would let a crafted
    # ALLOWED_TYPES escape both the heredoc and the string literal.
    - name: Create commitlint config
      if: ${{ inputs.CONFIG_FILE == '' }}
      run: |
        cat > commitlint.config.js << 'EOF'
        const allowedTypes = (process.env.COMMITLINT_ALLOWED_TYPES ?? '')
          .split(',').map(t => t.trim()).filter(Boolean);
        const requireScope = process.env.COMMITLINT_REQUIRE_SCOPE === 'true';
        const headerMaxLength = Number(process.env.COMMITLINT_MAX_SUBJECT_LENGTH ?? 100);

        export default {
          extends: ['@commitlint/config-conventional'],
          rules: {
            'type-enum': [2, 'always', allowedTypes],
            'scope-empty': [requireScope ? 2 : 0, requireScope ? 'never' : 'always'],
            'header-max-length': [2, 'always', headerMaxLength],
          },
        };
        EOF

    - name: Get commits to lint
      id: get-commits
      env:
        COMMITS_SOURCE: ${{ inputs.COMMITS_SOURCE }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail

        if [ "$COMMITS_SOURCE" = "pr" ] && [ -n "$PR_NUMBER" ]; then
          echo "Linting commits from PR #$PR_NUMBER"

          BASE_SHA="$PR_BASE_SHA"
          HEAD_SHA="$PR_HEAD_SHA"

          {
            echo "base-sha=${BASE_SHA}"
            echo "head-sha=${HEAD_SHA}"
            echo "commit-range=${BASE_SHA}..${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"
        else
          echo "Linting commits from push event"

          if [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch, use first commit
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
          else
            BASE_SHA="$EVENT_BEFORE"
          fi
          HEAD_SHA="$GITHUB_SHA"

          {
            echo "base-sha=${BASE_SHA}"
            echo "head-sha=${HEAD_SHA}"
            echo "commit-range=${BASE_SHA}..${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Lint commits
      id: lint
      env:
        CONFIG_FILE: ${{ inputs.CONFIG_FILE }}
        COMMIT_RANGE: ${{ steps.get-commits.outputs.commit-range }}
        ALLOWED_TYPES: ${{ inputs.ALLOWED_TYPES }}
        FAIL_ON_ERROR: ${{ inputs.FAIL_ON_ERROR }}
        # Read by the generated commitlint.config.js; ignored when the caller
        # supplied CONFIG_FILE.
        COMMITLINT_ALLOWED_TYPES: ${{ inputs.ALLOWED_TYPES }}
        COMMITLINT_REQUIRE_SCOPE: ${{ inputs.REQUIRE_SCOPE }}
        COMMITLINT_MAX_SUBJECT_LENGTH: ${{ inputs.MAX_SUBJECT_LENGTH }}
      run: |
        set -euo pipefail

        CONFIG_FLAG=()
        if [ -n "$CONFIG_FILE" ] && [ -f "$CONFIG_FILE" ]; then
          CONFIG_FLAG=(--config "$CONFIG_FILE")
        fi

        echo "## Conventional Commits Check" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        EXIT_CODE=0
        COMMITS=$(git log --pretty=format:"%H" "$COMMIT_RANGE" 2>/dev/null || echo "")

        if [ -z "$COMMITS" ]; then
          echo "No commits found in range $COMMIT_RANGE"
          echo "✅ No commits to lint" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        TOTAL_COMMITS=$(echo "$COMMITS" | wc -l | tr -d ' ')
        FAILED_COMMITS=0
        PASSED_COMMITS=0

        echo "| Status | Commit | Message |" >> "$GITHUB_STEP_SUMMARY"
        echo "| ------ | ------ | ------- |" >> "$GITHUB_STEP_SUMMARY"

        for COMMIT in $COMMITS; do
          MESSAGE=$(git log --format=%s -n 1 "$COMMIT")
          SHORT_SHA=$(echo "$COMMIT" | cut -c1-7)

          # The subject is written by whoever authored the commit, and the step
          # summary renders Markdown. Unescaped, a '|' closes the table cell and
          # the rest of the subject becomes new cells - enough to forge a passing
          # row next to a failing one - and '![](https://...)' renders a remote
          # image that reports every reviewer who opens the run. Escape the
          # table and Markdown metacharacters, then wrap the result in inline
          # code so what is left renders literally.
          SAFE_MESSAGE=${MESSAGE//\\/\\\\}
          SAFE_MESSAGE=${SAFE_MESSAGE//|/\\|}
          SAFE_MESSAGE=${SAFE_MESSAGE//\`/\\\`}
          # Collapse anything that is not printable ASCII or ordinary
          # punctuation - a CR or an escape sequence in a subject rewrites what
          # a terminal shows when the summary is read back.
          SAFE_MESSAGE=$(printf '%s' "$SAFE_MESSAGE" | tr -d '\000-\037')

          if echo "$MESSAGE" | bunx commitlint "${CONFIG_FLAG[@]}"; then
            echo "| ✅ | \`$SHORT_SHA\` | \`$SAFE_MESSAGE\` |" >> "$GITHUB_STEP_SUMMARY"
            PASSED_COMMITS=$((PASSED_COMMITS + 1))
          else
            echo "| ❌ | \`$SHORT_SHA\` | \`$SAFE_MESSAGE\` |" >> "$GITHUB_STEP_SUMMARY"
            FAILED_COMMITS=$((FAILED_COMMITS + 1))
            EXIT_CODE=1
          fi
        done

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Summary:** $PASSED_COMMITS/$TOTAL_COMMITS commits passed" >> "$GITHUB_STEP_SUMMARY"

        if [ $EXIT_CODE -ne 0 ]; then
          {
            echo ""
            echo "### Expected format"
            echo ""
            echo '```'
            echo "<type>(<scope>): <subject>"
            echo ""
            echo "Types: $ALLOWED_TYPES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Workflow failed due to non-conventional commits**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Non-conventional commits detected but FAIL_ON_ERROR is false**" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **All commits follow conventional commits format**" >> "$GITHUB_STEP_SUMMARY"
        fi
