name: Lint YAML

on:
  workflow_call:
    inputs:
      CONFIG_FILE:
        description: Path to yamllint configuration file
        type: string
        required: false
        default: ""
      SCAN_PATH:
        description: Path to scan for YAML files
        type: string
        required: false
        default: "."
      STRICT:
        description: Whether to use strict mode (treats warnings as errors)
        type: boolean
        required: false
        default: false
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  lint-yaml:
    name: Lint YAML files
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install yamllint
      run: pip install yamllint

    - name: Run yamllint
      env:
        CONFIG_FILE: ${{ inputs.CONFIG_FILE }}
        STRICT: ${{ inputs.STRICT }}
        SCAN_PATH: ${{ inputs.SCAN_PATH }}
      run: |
        set -euo pipefail

        ARGS=()

        if [ -n "$CONFIG_FILE" ] && [ -f "$CONFIG_FILE" ]; then
          ARGS+=(--config-file "$CONFIG_FILE")
        fi

        if [ "$STRICT" = "true" ]; then
          ARGS+=(--strict)
        fi

        yamllint "${ARGS[@]}" "$SCAN_PATH"
