name: CI

on:
  pull_request:
    branches:
    - main

jobs:
  path-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Check updated files paths
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        filters: |
          workflows:
            - '.github/workflows/**'

  lint-commits:
    uses: ./.github/workflows/lint-commits.yml
    permissions:
      contents: read
      pull-requests: read

  lint-yaml:
    uses: ./.github/workflows/lint-yaml.yml
    if: ${{ needs.path-filter.outputs.workflows == 'true' }}
    needs:
    - path-filter
    permissions:
      contents: read
    with:
      CONFIG_FILE: ci/configs/yamllint.yaml
      SCAN_PATH: ./.github/workflows
