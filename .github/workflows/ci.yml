name: CI

on:
  pull_request:
    branches:
    - main

jobs:
  path-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Check updated files paths
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        filters: |
          workflows:
            - '.github/workflows/**'
          tests:
            - 'ci/tests/**'

  lint-commits:
    uses: ./.github/workflows/lint-commits.yml
    permissions:
      contents: read
      pull-requests: read

  lint-yaml:
    uses: ./.github/workflows/lint-yaml.yml
    if: ${{ needs.path-filter.outputs.workflows == 'true' }}
    needs:
    - path-filter
    permissions:
      contents: read
    with:
      CONFIG_FILE: ci/configs/yamllint.yaml
      SCAN_PATH: ./.github/workflows

  test-workflows:
    name: Test workflows
    runs-on: ubuntu-24.04
    if: ${{ needs.path-filter.outputs.workflows == 'true' || needs.path-filter.outputs.tests == 'true' }}
    needs:
    - path-filter
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Schema, context availability and expression validation, plus shellcheck
    # over every `run:` block.
    - name: Lint workflows
      uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
      with:
        args: -color

    - name: Lint test scripts
      run: shellcheck ci/tests/*.sh

    # Executes the shell logic straight out of the workflow YAML against stubbed
    # credentials and a stubbed `gh`. See ci/tests/lib.sh.
    - name: Run workflow tests
      run: ./ci/tests/run.sh
