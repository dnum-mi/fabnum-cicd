name: Test Helm charts

on:
  workflow_call:
    inputs:
      CT_CONF_PATH:
        description: Path to the chart-testing configuration file
        required: true
        type: string
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  test-charts:
    name: Install charts
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        # No later step talks to the git remote, so the job's token need not
        # stay in .git/config while the rest of the job runs.
        persist-credentials: false

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.14'
        check-latest: true

    - name: Set up chart-testing
      uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510  # v2.9.0

    - name: Create kind cluster
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1

    - name: Run chart-testing (install)
      # Refs/paths via env (never inlined) so a branch name like '$(...)' can't
      # trigger command substitution in this shell
      #
      # The target is the branch the pull request merges into. ct installs the
      # charts that differ between it and HEAD, so naming the pull request's
      # own branch — head_ref, which this read until it was noticed — diffs the
      # branch against itself: "No chart changes detected", nothing installed,
      # and a green check for every chart change it was there to try.
      env:
        CT_CONF_PATH: ${{ inputs.CT_CONF_PATH }}
        TARGET_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
      run: |
        ct install \
          --config "$CT_CONF_PATH" \
          --target-branch "$TARGET_BRANCH"
