# Keeps one invariant true: the prerelease branch is the release branch plus
# only the work that has not been released yet.
#
# A release lands commits on the release branch that the prerelease branch does
# not have - release-please's release commit, and a chart bump when the chart
# lives in the same repository. Both edit files the prerelease branch also
# edits on its own cycle (the manifest, CHANGELOG.md, Chart.yaml), so a
# prerelease branch that never receives them ends up computing its next version
# from a stale base - emitting a version BELOW the one just published - and
# conflicting with the release branch on the next promotion.
#
# This is a workflow of its own, and a job the caller places LAST, because the
# only thing that decides when it is correct to run is "has the release branch
# stopped moving" - and nothing but the caller's job graph knows that. Encoding
# it as an input on a workflow that cannot see the graph is what made the
# earlier version silently wrong for pipelines that commit to the release
# branch after their release job (a monorepo chart bump, typically).
name: Sync prerelease branch

on:
  workflow_call:
    inputs:
      RELEASE_BRANCH:
        description: Branch releases are cut on, and the branch to synchronise FROM
        type: string
        required: false
        default: main
      PRERELEASE_BRANCH:
        description: Branch prereleases are cut on, and the branch to synchronise
        type: string
        required: false
        default: develop
      CREATE_IF_MISSING:
        description: >-
          Create PRERELEASE_BRANCH from RELEASE_BRANCH when it does not exist
          yet, rather than skipping. Bootstraps a repository adopting the
          two-branch flow; harmless afterwards, since the branch then always
          exists.
        type: boolean
        required: false
        default: true
      PRERELEASE_CONFIG_FILE:
        description: >-
          Release-please config file of the prerelease branch; the same value
          as release-app.yml's input. It lists the files release-please
          rewrites, and records the release anchor after a rebase.
        type: string
        required: false
        default: release-please-config-rc.json
      PRERELEASE_MANIFEST_FILE:
        description: Release-please manifest file of the prerelease branch; the same value as release-app.yml's input
        type: string
        required: false
        default: .release-please-manifest-rc.json
      RELEASE_MANIFEST_FILE:
        description: Release-please manifest file of the release branch; the same value as release-app.yml's input
        type: string
        required: false
        default: .release-please-manifest.json
      MANAGED_FILES:
        description: >-
          Files a release rewrites on RELEASE_BRANCH that PRERELEASE_BRANCH
          also rewrites on its own cycle, one path or glob per line, beyond
          what the release-please config already lists (manifests, changelogs,
          extra-files): typically Chart.yaml and the chart README when the
          chart lives in the repository. A rebase conflict confined to these
          files is resolved in favour of the prerelease branch instead of
          failing the job.
        type: string
        required: false
        default: ''
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        type: string
        required: false
        default: '["ubuntu-24.04"]'
    secrets:
      APP_CLIENT_ID:
        description: >-
          GitHub App Client ID (e.g. Iv23li..., NOT the numeric App ID). Supply
          with APP_PRIVATE_KEY when a ruleset on the prerelease branch rejects
          GITHUB_TOKEN, which cannot be named in a bypass list. Pushing as the
          App then starts the caller's workflows on that branch: see the
          checkout step. See docs/workflows/05-authentication.md.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Required alongside APP_CLIENT_ID.
        required: false

jobs:
  sync:
    name: Sync prerelease branch
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    # Only ever moves a branch of the caller's own repository.
    permissions:
      contents: write
    env:
      # `secrets` is not available in a step-level `if`, but it is here - so the
      # presence check is hoisted to the job and the step tests `env`.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      # Exactly one of the two set: a typo or a half-finished setup. Never a
      # valid configuration, and silently falling back would downgrade auth.
      HAS_PARTIAL_APP_AUTH: ${{ (secrets.APP_CLIENT_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
    - name: Validate inputs
      env:
        RELEASE_BRANCH: ${{ inputs.RELEASE_BRANCH }}
        PRERELEASE_BRANCH: ${{ inputs.PRERELEASE_BRANCH }}
      run: |
        set -euo pipefail

        if [ "$HAS_PARTIAL_APP_AUTH" = "true" ]; then
          echo "::error::APP_CLIENT_ID and APP_PRIVATE_KEY must be supplied together, but only one was. Continuing would silently fall back to GITHUB_TOKEN instead of authenticating as the App."
          exit 1
        fi

        # Rebasing a branch onto itself is not a no-op, it is a caller who will
        # never see a synchronisation happen.
        if [ "$RELEASE_BRANCH" = "$PRERELEASE_BRANCH" ]; then
          echo "::error::RELEASE_BRANCH and PRERELEASE_BRANCH are both '$RELEASE_BRANCH'. They name the two ends of the synchronisation and must differ."
          exit 1
        fi

        if [ -z "$RELEASE_BRANCH" ] || [ -z "$PRERELEASE_BRANCH" ]; then
          echo "::error::RELEASE_BRANCH and PRERELEASE_BRANCH must both be set."
          exit 1
        fi

    # GITHUB_TOKEN by default, on purpose. This step force-pushes the prerelease
    # branch, which is a branch the caller's CD pipeline triggers on; under a
    # credential that can trigger workflows that push would re-enter the
    # pipeline, and a release moving the branch would start a prerelease run.
    # GITHUB_TOKEN cannot trigger workflow runs, which is what prevents it.
    #
    # A caller whose rulesets reject that push - a pull request required for
    # every push, linear history, required status checks - has no way to except
    # GITHUB_TOKEN: only a GitHub App can be named in a bypass list. Supplying
    # APP_CLIENT_ID/APP_PRIVATE_KEY switches this push, and only this push, to
    # the App token. That trade lifts the guarantee above: moving the branch
    # then starts the caller's workflows on it, so supply the App only once a
    # run on the prerelease branch that finds nothing new to release is safe
    # for the pipeline (release-please is idempotent).
    # Scoped to this repository only: passing `owner:` without `repositories:`
    # would widen the token to every repo in the installation.
    - name: Generate GitHub App token
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token || github.token }}

    - name: Configure Git
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Ensure ${{ inputs.PRERELEASE_BRANCH }} is up to date with ${{ inputs.RELEASE_BRANCH }}
      env:
        RELEASE_BRANCH: ${{ inputs.RELEASE_BRANCH }}
        PRERELEASE_BRANCH: ${{ inputs.PRERELEASE_BRANCH }}
        CREATE_IF_MISSING: ${{ inputs.CREATE_IF_MISSING }}
        PRERELEASE_CONFIG_FILE: ${{ inputs.PRERELEASE_CONFIG_FILE }}
        PRERELEASE_MANIFEST_FILE: ${{ inputs.PRERELEASE_MANIFEST_FILE }}
        RELEASE_MANIFEST_FILE: ${{ inputs.RELEASE_MANIFEST_FILE }}
        MANAGED_FILES: ${{ inputs.MANAGED_FILES }}
      run: |
        set -euo pipefail

        # The bootstrap probe comes before every other git command: each one
        # below names $PRERELEASE_BRANCH - the unshallow fetch included - and
        # fails hard on a branch that does not exist yet, which would make
        # the creation path unreachable on the default shallow checkout.
        if ! git ls-remote --exit-code --heads origin "$PRERELEASE_BRANCH" >/dev/null 2>&1; then
          if [ "$CREATE_IF_MISSING" != "true" ]; then
            echo "'$PRERELEASE_BRANCH' branch does not exist and CREATE_IF_MISSING is false, nothing to do"
            exit 0
          fi

          echo "'$PRERELEASE_BRANCH' branch does not exist. Creating from $RELEASE_BRANCH..."

          git fetch origin "$RELEASE_BRANCH"
          git checkout -b "$PRERELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          git push origin "$PRERELEASE_BRANCH"
          exit 0
        fi

        # actions/checkout's default fetch-depth (1) leaves this clone
        # shallow, with no history shared between $RELEASE_BRANCH and
        # $PRERELEASE_BRANCH for git to compute a real merge-base from. The
        # rebase below would then treat every commit on $PRERELEASE_BRANCH as
        # unrelated to $RELEASE_BRANCH, replaying the whole branch from
        # scratch and conflicting on every file it touches - even when the
        # actual divergence is trivial. Guarded because --unshallow errors
        # outright on a repository that is already complete.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --unshallow origin "$RELEASE_BRANCH" "$PRERELEASE_BRANCH"
        fi

        git fetch origin "$RELEASE_BRANCH" "$PRERELEASE_BRANCH" || true

        echo "'$PRERELEASE_BRANCH' branch exists. Attempting rebase on $RELEASE_BRANCH..."

        git checkout "$PRERELEASE_BRANCH"
        git reset --hard "origin/$PRERELEASE_BRANCH"

        # The tip the push below may replace. The default lease follows the
        # remote-tracking branch, which any later fetch moves: a commit landing
        # on $PRERELEASE_BRANCH while this runs would then be overwritten
        # instead of rejected.
        expected=$(git rev-parse "origin/$PRERELEASE_BRANCH")

        # Paths reach git as names, never as patterns: a file called
        # `[id].tsx` or `*.md` must not select others.
        export GIT_LITERAL_PATHSPECS=1

        # The files a release rewrites on $RELEASE_BRANCH and the prerelease
        # branch rewrites on its own cycle: both manifests, the changelog and
        # extra-files release-please is configured to touch, and whatever the
        # caller adds (Chart.yaml and the chart README for a chart that lives
        # in the repository). What they hold is bookkeeping derived from the
        # release history, not work, so a conflict confined to them has one
        # right answer; any other conflicting file is real work and still fails
        # the job.
        managed_paths() {
          printf '%s\n' "$PRERELEASE_MANIFEST_FILE" "$RELEASE_MANIFEST_FILE" "$MANAGED_FILES"
          [ -f "$PRERELEASE_CONFIG_FILE" ] || return 0
          jq -r '
            def under($dir; $path):
              if ($path | startswith("/")) then $path[1:]
              elif $dir == "." then $path
              else "\($dir)/\($path)" end;
            . as $top
            | (.packages // {} | to_entries[]) as $pkg
            | $pkg.key as $dir
            | under($dir; $pkg.value["changelog-path"] // $top["changelog-path"] // "CHANGELOG.md"),
              (($pkg.value["extra-files"] // $top["extra-files"] // [])[]
                | (if type == "string" then . else .path end)
                | under($dir; .))
          ' "$PRERELEASE_CONFIG_FILE"
        }

        if ! managed=$(managed_paths); then
          echo "::warning::Could not read the files release-please manages from $PRERELEASE_CONFIG_FILE; any rebase conflict will fail the job."
          managed=""
        fi

        is_managed() {
          local file="$1" pattern
          while IFS= read -r pattern; do
            pattern="${pattern%$'\r'}"
            pattern="${pattern#./}"
            [ -n "$pattern" ] || continue
            # The pattern as a plain path first, for a name with glob
            # characters in it, then as a glob.
            # shellcheck disable=SC2053 # a glob match is the intent
            if [[ "$file" == "$pattern" || "$file" == $pattern ]]; then
              return 0
            fi
          done <<<"$managed"
          return 1
        }

        # Which side wins the conflicting hunks of such a file. The prerelease
        # branch, whose next versions are computed from that state. Except
        # the release manifest, which on both branches records what the release
        # branch published, and changelogs, which record history: both sides.
        resolution_for() {
          case "${1##*/}" in
            *[Cc][Hh][Aa][Nn][Gg][Ee][Ll][Oo][Gg]*)
              echo "--union"
              ;;
            *)
              if [ "$1" = "${RELEASE_MANIFEST_FILE#./}" ]; then
                echo "--ours"
              else
                echo "--theirs"
              fi
              ;;
          esac
        }

        # Merges the three stages of a conflicted file hunk by hunk, so what
        # the release branch changed outside the conflicting hunks is kept:
        # `git checkout --theirs` would replace the whole file with the
        # replayed commit's and silently drop it (a hotfix to a dependency
        # pinned in the same file, a changelog section). In a rebase `ours`
        # is the release branch and `theirs` the commit being replayed.
        resolve_conflict() {
          local file="$1" stages work

          stages=$(git ls-files -u -- "$file" | awk '{ print $3 }' | sort -u | tr '\n' ' ')
          case "$stages" in
            "1 2 3 " | "2 3 ") ;;
            *)
              echo "::error::'$file' conflicts because it was deleted on one side, which is not a conflict to settle by taking a side."
              return 1
              ;;
          esac

          work=$(mktemp -d) || return 1
          git show ":2:$file" >"$work/ours" || { rm -rf "$work"; return 1; }
          git show ":3:$file" >"$work/theirs" || { rm -rf "$work"; return 1; }
          # Added on both sides: no common ancestor, an empty one stands in.
          if [ "$stages" = "1 2 3 " ]; then
            git show ":1:$file" >"$work/base" || { rm -rf "$work"; return 1; }
          else
            : >"$work/base"
          fi

          if ! git merge-file -p "$(resolution_for "$file")" "$work/ours" "$work/base" "$work/theirs" >"$work/merged"; then
            echo "::error::Could not merge '$file' (a binary file?)."
            rm -rf "$work"
            return 1
          fi
          cat "$work/merged" >"$file" || { rm -rf "$work"; return 1; }
          rm -rf "$work"
          git add -- "$file"
        }

        # A function run under `if` loses `set -e`, so every step that can
        # fail returns explicitly.
        rebase_onto_release_branch() {
          local file attempts=0
          local -a conflicted

          if git rebase "origin/$RELEASE_BRANCH"; then
            return 0
          fi

          # One pass per replayed commit that conflicts; bounded so a state
          # this loop does not understand cannot spin forever.
          while [ "$attempts" -lt 200 ]; do
            attempts=$((attempts + 1))

            conflicted=()
            while IFS= read -r -d '' file; do
              conflicted+=("$file")
            done < <(git diff --name-only -z --diff-filter=U)
            # Failed for a reason other than a conflict.
            [ "${#conflicted[@]}" -gt 0 ] || return 1

            for file in "${conflicted[@]}"; do
              if ! is_managed "$file"; then
                echo "::error::'$file' conflicts between '$PRERELEASE_BRANCH' and '$RELEASE_BRANCH' and is not a file a release rewrites, so it is real work to reconcile by hand."
                return 1
              fi
            done

            for file in "${conflicted[@]}"; do
              echo "Conflict in '$file', which a release rewrites: merged hunk by hunk, conflicting hunks resolved with $(resolution_for "$file")."
              resolve_conflict "$file" || return 1
            done

            # A replayed commit whose only change was one of those files is
            # empty once resolved, and `rebase --continue` refuses it.
            if git diff --cached --quiet; then
              if git rebase --skip; then
                return 0
              fi
            elif GIT_EDITOR=true git rebase --continue; then
              return 0
            fi
          done

          return 1
        }

        # The newest commit of a range with subject $2 and author date $3. A
        # rebase, a cherry-pick and a rebase-merge keep both, so a commit that
        # merely shares a common subject ("fix: typo") is not taken for it.
        find_release_commit() {
          local log
          log=$(git log --format='%H%x09%at%x09%s' "$1")
          SUBJECT="$2" AUTHORED="$3" awk -F '\t' '$3 == ENVIRON["SUBJECT"] && $2 == ENVIRON["AUTHORED"] { print $1; exit }' <<<"$log"
        }

        # The rebase replays the prerelease branch's commits under new SHAs,
        # the release commits among them. release-please finds the last
        # prerelease by its tag - the one named after the version in the
        # prerelease manifest - and reads the branch history down to that
        # tag's commit. After a rebase the tag still points at the commit as it
        # was, which is no longer in the branch: it never finds the stop,
        # falls back to the 500 most recent commits, and proposes a wrong
        # version (a major bump from an old breaking commit) and a changelog
        # repeating everything already released.
        #
        # Moving the tag is not an option: tags are what registries and
        # mirrors build versions from, and a version must keep meaning the
        # commit it was built from. `last-release-sha` in the prerelease
        # config tells release-please where to start instead. It has to be a
        # commit on the branch because release-please reads that config from
        # GitHub, not from a workspace. Once the next prerelease is tagged
        # release-please reaches that tag before this commit and the key is
        # inert; the next rebase that orphans a tag refreshes it.
        #
        # Single-package manifests only: the key is one commit for the whole
        # repository, which cannot anchor several packages at once.
        anchor_release_please() {
          local version tag exact suffix suffixes name subject authored replayed current tmp

          if [ ! -f "$PRERELEASE_MANIFEST_FILE" ] || [ ! -f "$PRERELEASE_CONFIG_FILE" ]; then
            echo "::warning::No $PRERELEASE_MANIFEST_FILE or $PRERELEASE_CONFIG_FILE on '$PRERELEASE_BRANCH', so the release anchor is not maintained. If release-please uses other file names, pass them as PRERELEASE_MANIFEST_FILE and PRERELEASE_CONFIG_FILE, as to release-app.yml."
            return 0
          fi

          if ! jq empty "$PRERELEASE_MANIFEST_FILE" "$PRERELEASE_CONFIG_FILE" 2>/dev/null; then
            echo "::warning::$PRERELEASE_MANIFEST_FILE or $PRERELEASE_CONFIG_FILE is not valid JSON, so the release anchor is not maintained."
            return 0
          fi

          version=$(jq -r 'if length == 1 then to_entries[0].value else empty end' "$PRERELEASE_MANIFEST_FILE")
          if [ -z "$version" ]; then
            echo "::warning::$PRERELEASE_MANIFEST_FILE does not track exactly one package: the release anchor can be neither maintained nor checked, so release-please can propose a wrong version on '$PRERELEASE_BRANCH' after this rebase."
            return 0
          fi

          # Tags only: a plain `fetch --tags` would also move the
          # remote-tracking branches.
          if ! git fetch --quiet origin '+refs/tags/*:refs/tags/*'; then
            echo "::warning::Could not fetch the tags, so the release anchor is not maintained."
            return 0
          fi

          # The release of $version as published: the tag named after it,
          # `v<version>` or `<version>`, else the one tag ending in it (a
          # component prefix). Several suffix matches (lockstep chart and app
          # tags) are ambiguous. Kept identical to release-app.yml, which has to
          # pick the same tag. Not limited to tags reachable from the branch
          # before this rebase: a branch anchored by an earlier rebase no
          # longer reaches that tag at all.
          exact=""
          suffix=""
          suffixes=0
          while IFS= read -r name; do
            case "$name" in
              "v$version" | "$version")
                [ -n "$exact" ] || exact="$name"
                ;;
              *[!0-9A-Za-z.]"$version" | *[!0-9A-Za-z.]"v$version")
                suffix="$name"
                suffixes=$((suffixes + 1))
                ;;
            esac
          done < <(git tag --list)

          if [ -n "$exact" ]; then
            tag="$exact"
          elif [ "$suffixes" -eq 1 ]; then
            tag="$suffix"
          elif [ "$suffixes" -gt 1 ]; then
            echo "::warning::Several tags end with the version $version, so the release anchor is not maintained."
            return 0
          else
            return 0
          fi

          if git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
            return 0
          fi

          # Its release commit again, under its new SHA: same subject and
          # author date. Among the commits replayed onto the release branch;
          # or, when the rebase replayed nothing, on the release branch
          # itself. That is the case right after a promotion, which can only
          # be a rebase-merge when merge commits are off: the promotion copied
          # the series onto the release branch under new SHAs, so the rebase
          # finds every commit already upstream, drops it, and the tag is
          # orphaned all the same.
          subject=$(git log -1 --format=%s "refs/tags/$tag")
          authored=$(git log -1 --format=%at "refs/tags/$tag")
          replayed=$(find_release_commit "origin/$RELEASE_BRANCH..HEAD" "$subject" "$authored")
          if [ -z "$replayed" ]; then
            replayed=$(find_release_commit "origin/$RELEASE_BRANCH" "$subject" "$authored")
          fi
          if [ -z "$replayed" ]; then
            echo "::warning::Could not find the release commit of $version ('$subject') on '$PRERELEASE_BRANCH' or '$RELEASE_BRANCH'. release-please will not find its starting point on '$PRERELEASE_BRANCH'."
            return 0
          fi

          current=$(jq -r '.["last-release-sha"] // empty' "$PRERELEASE_CONFIG_FILE")
          if [ "$current" = "$replayed" ]; then
            return 0
          fi

          tmp=$(mktemp)
          jq --indent 2 --arg sha "$replayed" '.["last-release-sha"] = $sha' "$PRERELEASE_CONFIG_FILE" >"$tmp"
          cat "$tmp" >"$PRERELEASE_CONFIG_FILE"
          rm -f "$tmp"

          git add -- "$PRERELEASE_CONFIG_FILE"
          git commit --quiet \
            -m "chore($PRERELEASE_BRANCH): anchor release-please on $version" \
            -m "The rebase onto $RELEASE_BRANCH moved the release commit of $version to $replayed, and the tag $tag no longer points into $PRERELEASE_BRANCH. last-release-sha makes release-please start from that commit."
          echo "Anchored release-please on $replayed, the release commit of $version."
        }

        # In the steady state this is a plain fast-forward: the promotion put
        # the prerelease branch's commits into the release branch, so
        # `$RELEASE_BRANCH..$PRERELEASE_BRANCH` is empty and nothing is
        # replayed. It only does real work when the prerelease branch moved
        # while the release was running - which is possible whenever the
        # caller's concurrency group is keyed on the branch, and is exactly
        # the case a plain push would reject - or after a hotfix on the
        # release branch, which replays the whole unreleased series.
        if rebase_onto_release_branch; then
          anchor_release_please

          echo "Rebase successful. Pushing updated $PRERELEASE_BRANCH..."

          git push --force-with-lease="$PRERELEASE_BRANCH:$expected" origin "$PRERELEASE_BRANCH"
        else
          echo "::error::Rebase of '$PRERELEASE_BRANCH' onto '$RELEASE_BRANCH' failed due to conflicts. Resolve it by hand: until then the prerelease branch computes its versions from a stale base and can publish below the version just released."

          git rebase --abort || true
          exit 1
        fi
