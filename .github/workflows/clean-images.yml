name: Clean images

on:
  workflow_call:
    inputs:
      IMAGE:
        description: >-
          Image to act on (e.g. 'ghcr.io/owner/repo/service:pr-123'). The tag is
          required by CLEAN_TAGGED and ignored by CLEAN_ORPHANED, which reads
          only the package name.
        required: true
        type: string
      CLEAN_TAGGED:
        description: Delete the exact tag referenced by IMAGE
        required: false
        type: boolean
        default: true
      CLEAN_ORPHANED:
        description: >-
          Delete every version of the package whose tags are all git SHAs, left
          behind when a moving tag was reassigned to a newer build.
        required: false
        type: boolean
        default: false
      PROTECTED_TAGS:
        description: >-
          Comma separated tags that must never be deleted, on top of the
          version-like tags (0.2.0, 0.2.0-rc.1, v1.2.3) that are always kept.
          Guards against an ephemeral tag sharing a digest with a release.
        required: false
        type: string
        default: 'latest,main,develop'
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  cleanup-image:
    name: Delete image from ghcr.io
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: write
    if: ${{ inputs.CLEAN_TAGGED }}
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Delete ${{ inputs.IMAGE }} image
      env:
        IMAGE: ${{ inputs.IMAGE }}
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        PROTECTED_TAGS: ${{ inputs.PROTECTED_TAGS }}
      run: |
        set -euo pipefail

        # Parse image name
        REGISTRY_CHECK="${IMAGE%%/*}"
        if [[ "$REGISTRY_CHECK" == *.* || "$REGISTRY_CHECK" == *:* || "$REGISTRY_CHECK" == "localhost" ]]; then
          IMAGE_WITHOUT_REGISTRY="${IMAGE#*/}"
          PROCESSED_IMAGE="${IMAGE_WITHOUT_REGISTRY#*/}"
        else
          PROCESSED_IMAGE="$IMAGE"
        fi

        IMAGE_NAME="${PROCESSED_IMAGE%%:*}"
        IMAGE_TAG="${PROCESSED_IMAGE#*:}"

        # CLEAN_ORPHANED reads only the package name, so IMAGE is routinely
        # passed untagged. Deleting by tag needs one: with no colon the
        # expansion above leaves IMAGE_TAG equal to IMAGE_NAME, which would
        # look up a tag that cannot exist and report "not found" - a green run
        # that quietly deleted nothing. Fail loudly instead.
        if [ "$IMAGE_TAG" = "$IMAGE_NAME" ]; then
          echo "::error::IMAGE must include a tag when CLEAN_TAGGED is enabled (got '$IMAGE')"
          exit 1
        fi

        IMAGE_NAME_URL_ENCODED="$(jq -rn --arg x "$IMAGE_NAME" '$x | @uri')"

        # Determine owner type
        OWNER_TYPE="$(gh api "/users/$OWNER" --jq '.type')"

        if [ "$OWNER_TYPE" = "Organization" ]; then
          API_MODE="orgs"
        else
          API_MODE="users"
        fi

        echo "Owner: $OWNER ($OWNER_TYPE)"
        echo "Image: $IMAGE_NAME"
        echo "Tag: $IMAGE_TAG"

        # Fetch all versions
        ALL_VERSIONS=$(gh api -H "Accept: application/vnd.github+json" \
          "/$API_MODE/$OWNER/packages/container/$IMAGE_NAME_URL_ENCODED/versions" \
          --paginate --jq '.')

        # Get main image ID
        MAIN_IMAGE_ID=$(echo "$ALL_VERSIONS" | jq -r --arg t "$IMAGE_TAG" \
          '.[] | select(.metadata.container.tags[]? == $t) | .id' | head -n1)

        if [ -z "$MAIN_IMAGE_ID" ]; then
          echo "Image with tag '$IMAGE_TAG' not found"
          exit 0
        fi

        # A version carries every tag ever pushed to that digest, so deleting
        # by one tag deletes all of them. Refuse when the version is also a
        # release, a prerelease or an explicitly protected moving tag: those
        # are meant to be kept indefinitely, and no ephemeral tag sharing the
        # digest is worth taking them down with it. Nothing to do with the
        # usual case - a pull request build and a release build are distinct
        # commits - but this is invoked on a schedule over many tags at once,
        # where one bad argument would otherwise be silently destructive.
        PROTECTED_MATCHES=$(printf '%s' "$ALL_VERSIONS" | jq -r \
          --arg t "$IMAGE_TAG" --arg p "$PROTECTED_TAGS" '
          ($p | split(",") | map(select(length > 0))) as $keep
          | [ .[] | select(.metadata.container.tags[]? == $t) ] | first
          | ((.metadata.container.tags) // [])
          | map(select(test("^v?[0-9]+\\.[0-9]+") or (. as $x | $keep | any(. == $x))))
          | join(", ")
        ')

        if [ -n "$PROTECTED_MATCHES" ]; then
          echo "::warning::Refusing to delete $IMAGE_NAME:$IMAGE_TAG - that version is also tagged $PROTECTED_MATCHES"
          exit 0
        fi

        echo "Found image ID: $MAIN_IMAGE_ID"

        # A version is the ONLY thing keeping a package visible in the UI, so
        # the registry refuses to delete the last tagged version of a package
        # outright - you would have to delete the whole package instead. That
        # is routinely hit here: a package with a single active PR build (no
        # release, dev or latest tag pushed to it yet) has nothing else to
        # fall back to once that PR closes. Deleting the package is too
        # destructive for an unattended daily sweep, so this is left in place
        # - the next PR to build into the same package adds a second tagged
        # version, and this one is swept normally from then on.

        # Delete multi-arch manifests
        if MANIFEST_OUTPUT=$(docker buildx imagetools inspect "ghcr.io/$OWNER/$IMAGE_NAME:$IMAGE_TAG" --raw 2>/dev/null); then
          if MANIFESTS=$(echo "$MANIFEST_OUTPUT" | jq -r '.manifests[]? | .digest' 2>/dev/null); then
            if [ -n "$MANIFESTS" ]; then
              echo "Deleting multi-arch manifests..."
              while IFS= read -r SHA; do
                if [ -n "$SHA" ]; then
                  MANIFEST_ID=$(echo "$ALL_VERSIONS" | jq -r --arg s "$SHA" \
                    '.[] | select(.name == $s) | .id')

                  if [ -n "$MANIFEST_ID" ] && [ "$MANIFEST_ID" != "null" ]; then
                    echo "Deleting manifest: $SHA"
                    gh api --method DELETE -H "Accept: application/vnd.github+json" \
                      "/$API_MODE/$OWNER/packages/container/$IMAGE_NAME_URL_ENCODED/versions/$MANIFEST_ID" \
                      2>/dev/null || echo "Failed to delete manifest $SHA"
                  fi
                fi
              done <<< "$MANIFESTS"
            fi
          fi
        fi

        # Delete main image
        echo "Deleting main image: $IMAGE_NAME:$IMAGE_TAG"
        if DELETE_ERROR=$(gh api --method DELETE -H "Accept: application/vnd.github+json" \
          "/$API_MODE/$OWNER/packages/container/$IMAGE_NAME_URL_ENCODED/versions/$MAIN_IMAGE_ID" 2>&1 1>/dev/null); then
          echo "Image deletion completed"
        elif printf '%s' "$DELETE_ERROR" | grep -qi "cannot delete the last tagged version"; then
          echo "::warning::Cannot delete $IMAGE_NAME:$IMAGE_TAG - it is the last tagged version left in this package, and the registry refuses to delete that. Leaving it in place; it will be swept once another tagged version exists in $IMAGE_NAME."
        else
          echo "$DELETE_ERROR" >&2
          exit 1
        fi

  cleanup-orphaned-image:
    name: Delete orphaned images from ghcr.io
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: write
    if: ${{ inputs.CLEAN_ORPHANED }}
    steps:
    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Delete orphaned build artifacts
      env:
        IMAGE: ${{ inputs.IMAGE }}
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail

        # Parse image name
        REGISTRY_CHECK="${IMAGE%%/*}"
        if [[ "$REGISTRY_CHECK" == *.* || "$REGISTRY_CHECK" == *:* || "$REGISTRY_CHECK" == "localhost" ]]; then
          IMAGE_WITHOUT_REGISTRY="${IMAGE#*/}"
          PROCESSED_IMAGE="${IMAGE_WITHOUT_REGISTRY#*/}"
        else
          PROCESSED_IMAGE="$IMAGE"
        fi

        IMAGE_NAME="${PROCESSED_IMAGE%%:*}"
        IMAGE_NAME_URL_ENCODED="$(jq -rn --arg x "$IMAGE_NAME" '$x | @uri')"

        # Determine owner type
        OWNER_TYPE="$(gh api "/users/$OWNER" --jq '.type')"

        if [ "$OWNER_TYPE" = "Organization" ]; then
          API_MODE="orgs"
        else
          API_MODE="users"
        fi

        echo "Owner: $OWNER ($OWNER_TYPE)"
        echo "Image: $IMAGE_NAME"
        echo "Searching for orphaned build artifacts..."

        # Fetch all versions
        ALL_VERSIONS=$(gh api -H "Accept: application/vnd.github+json" \
          "/$API_MODE/$OWNER/packages/container/$IMAGE_NAME_URL_ENCODED/versions" \
          --paginate --jq '.')

        # A version is orphaned once every tag it still carries is a short/long
        # git SHA: a moving tag like 'pr-<N>' or a branch name was reassigned to
        # a newer build, and nothing meaningful (branch, PR, semver, latest)
        # keeps this one alive anymore. Matching on "all tags are SHA-like"
        # (rather than requiring exactly one tag) also catches builds that carry
        # more than one SHA-shaped tag at once.
        ORPHANED_IMAGES=$(echo "$ALL_VERSIONS" | jq -c \
          '.[] | select(.metadata.container.tags != null and .metadata.container.tags != []) |
          select(.metadata.container.tags | all(test("^[0-9a-f]{7,40}$"))) |
          {id: .id, digest: .name, tags: .metadata.container.tags}')

        if [ -z "$ORPHANED_IMAGES" ]; then
          echo "No orphaned build artifacts found"
          exit 0
        fi

        ORPHANED_COUNT=$(echo "$ORPHANED_IMAGES" | wc -l | tr -d ' ')
        echo "Found $ORPHANED_COUNT orphaned build artifact(s)"

        # Delete each orphaned image, along with the per-platform images it
        # references if it is a multi-arch manifest list (those are never
        # tagged themselves and would otherwise be left dangling forever).
        while IFS= read -r ORPHANED_IMAGE; do
          IMAGE_ID=$(echo "$ORPHANED_IMAGE" | jq -r '.id')
          IMAGE_DIGEST=$(echo "$ORPHANED_IMAGE" | jq -r '.digest')
          IMAGE_TAGS=$(echo "$ORPHANED_IMAGE" | jq -r '.tags | join(", ")')

          if MANIFEST_OUTPUT=$(docker buildx imagetools inspect "ghcr.io/$OWNER/$IMAGE_NAME@$IMAGE_DIGEST" --raw 2>/dev/null); then
            if MANIFESTS=$(echo "$MANIFEST_OUTPUT" | jq -r '.manifests[]? | .digest' 2>/dev/null); then
              while IFS= read -r SHA; do
                if [ -n "$SHA" ]; then
                  MANIFEST_ID=$(echo "$ALL_VERSIONS" | jq -r --arg s "$SHA" \
                    '.[] | select(.name == $s) | .id')

                  if [ -n "$MANIFEST_ID" ] && [ "$MANIFEST_ID" != "null" ]; then
                    echo "Deleting platform image: $SHA"
                    gh api --method DELETE -H "Accept: application/vnd.github+json" \
                      "/$API_MODE/$OWNER/packages/container/$IMAGE_NAME_URL_ENCODED/versions/$MANIFEST_ID" \
                      2>/dev/null || echo "Failed to delete platform image $SHA"
                  fi
                fi
              done <<< "$MANIFESTS"
            fi
          fi

          echo "Deleting orphaned image ID: $IMAGE_ID (tags: $IMAGE_TAGS)"
          gh api --method DELETE -H "Accept: application/vnd.github+json" \
            "/$API_MODE/$OWNER/packages/container/$IMAGE_NAME_URL_ENCODED/versions/$IMAGE_ID" \
            2>/dev/null || echo "Failed to delete image ID: $IMAGE_ID"
        done <<< "$ORPHANED_IMAGES"

        echo "Orphaned build artifacts cleanup completed"
