name: CD

on:
  push:
    branches:
    - main

jobs:
  path-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      release: ${{ steps.filter.outputs.release }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Check updated files paths
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        # 'every' is required for negation patterns (!) to work correctly.
        # With the default 'some', a file matching any positive rule wins,
        # so '!ci.yml' exclusions are silently ignored.
        predicate-quantifier: 'every'
        filters: |
          workflows:
            - '.github/workflows/**'
            - '!.github/workflows/ci.yml'
            - '!.github/workflows/cd.yml'
          release:
            - '.release-please-manifest.json'

  release:
    uses: ./.github/workflows/release-app.yml
    if: ${{ needs.path-filter.outputs.workflows == 'true' || needs.path-filter.outputs.release == 'true' }}
    needs:
    - path-filter
    permissions:
      issues: write
      pull-requests: write
      contents: write
    with:
      TAG_MAJOR_AND_MINOR: true
      AUTOMERGE_RELEASE: false
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
