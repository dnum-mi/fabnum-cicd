name: CD

on:
  push:
    branches:
    - main

jobs:
  path-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      release: ${{ steps.filter.outputs.release }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Check updated files paths
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      id: filter
      with:
        # 'every' is required for negation patterns (!) to work correctly.
        # With the default 'some', a file matching any positive rule wins,
        # so '!ci.yml' exclusions are silently ignored.
        predicate-quantifier: 'every'
        filters: |
          workflows:
            - '.github/workflows/**'
            - '!.github/workflows/ci.yml'
            - '!.github/workflows/cd.yml'
          release:
            - '.release-please-manifest.json'

  release:
    uses: ./.github/workflows/release-app.yml
    if: ${{ needs.path-filter.outputs.workflows == 'true' || needs.path-filter.outputs.release == 'true' }}
    needs:
    - path-filter
    permissions:
      issues: write
      pull-requests: write
      contents: write
    with:
      TAG_MAJOR_AND_MINOR: true
      AUTOMERGE_RELEASE: false
    # secrets:
    #   GH_PAT: ${{ secrets.GH_PAT }}
