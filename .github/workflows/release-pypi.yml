name: Release PyPI

# Publishes what build-python.yml built. The two are separate on purpose: the
# build runs the project's build backend and third-party tools, so it holds no
# OIDC token, and this job - the only one that can mint one - never runs
# project code, it uploads an artifact.

on:
  workflow_call:
    inputs:
      ARTIFACT:
        description: Name of the artifact holding the distributions (the `artifact` output of build-python.yml)
        required: true
        type: string
      PACKAGE:
        description: Distribution name (the `name` output of build-python.yml). Only used to install the published version back
        required: false
        type: string
        default: ""
      VERSION:
        description: Version published (the `version` output of build-python.yml). Only used to install the published version back
        required: false
        type: string
        default: ""
      PYTHON_VERSION:
        description: Python version used to install the published version back from the index
        required: false
        type: string
        default: "3.13"
      REPOSITORY_URL:
        description: >-
          Upload endpoint of the package index (e.g.,
          https://test.pypi.org/legacy/ for TestPyPI). Empty publishes to PyPI.
        required: false
        type: string
        default: ""
      ATTESTATIONS:
        description: >-
          Generate and upload PEP 740 attestations. Only effective with trusted
          publishing: they are switched off when a PYPI_TOKEN is supplied.
        required: false
        type: boolean
        default: true
      VERIFY_INSTALL:
        description: >-
          Once published, install PACKAGE==VERSION back from PyPI in a clean
          environment, retrying while the index catches up. Skipped without
          PACKAGE and VERSION, and for a custom REPOSITORY_URL.
        required: false
        type: boolean
        default: true
      ENVIRONMENT:
        description: >-
          GitHub environment the job runs in. PyPI recommends scoping a trusted
          publisher to one (it is then part of what PyPI validates, and can
          require a reviewer); only this workflow can set it, a caller job
          cannot. Empty runs in no environment.
        required: false
        type: string
        default: ""
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      PYPI_TOKEN:
        description: >-
          API token of the package index. Optional when the project has a
          trusted publisher (OIDC) configured for the caller's workflow - the
          caller job's id-token: write permission is used instead. Required
          otherwise.
        required: false

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    # An empty string is not a valid environment name; null means none.
    environment: ${{ inputs.ENVIRONMENT || null }}
    permissions:
      id-token: write
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: ${{ inputs.ARTIFACT }}
        path: dist

    - name: Publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        packages-dir: dist
        # Spelled out: an explicitly empty value would override the action's
        # own default rather than fall back to it.
        repository-url: ${{ inputs.REPOSITORY_URL || 'https://upload.pypi.org/legacy/' }}
        # Attestations are signed with the OIDC identity, which a token upload
        # does not use.
        attestations: ${{ inputs.ATTESTATIONS && secrets.PYPI_TOKEN == '' }}
        # Empty means trusted publishing (OIDC).
        password: ${{ secrets.PYPI_TOKEN }}

    - name: Set up uv
      if: ${{ inputs.VERIFY_INSTALL && inputs.PACKAGE != '' && inputs.VERSION != '' && inputs.REPOSITORY_URL == '' }}
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: false

    # No checkout in this job: a uv.toml or pyproject of the repository
    # (exclude-newer, a private index) cannot change what the index is asked.
    - name: Install the published version in a clean environment
      if: ${{ inputs.VERIFY_INSTALL && inputs.PACKAGE != '' && inputs.VERSION != '' && inputs.REPOSITORY_URL == '' }}
      env:
        PACKAGE: ${{ inputs.PACKAGE }}
        VERSION: ${{ inputs.VERSION }}
        PYTHON_VERSION: ${{ inputs.PYTHON_VERSION }}
      run: |
        set -euo pipefail

        # The index can take a moment to serve what it just accepted.
        venv="$RUNNER_TEMP/index-check"
        for attempt in 1 2 3 4 5 6; do
          rm -rf "$venv"
          if uv venv --python "$PYTHON_VERSION" "$venv" \
            && uv pip install --python "$venv" --no-cache "$PACKAGE==$VERSION"; then
            echo "Installed $PACKAGE==$VERSION from the index"
            exit 0
          fi
          echo "$PACKAGE==$VERSION is not on the index yet (attempt $attempt/6), retrying in 20s"
          sleep 20
        done

        echo "::error::$PACKAGE==$VERSION could not be installed from the index after publishing."
        exit 1
