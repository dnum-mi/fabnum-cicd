name: Update chart

on:
  workflow_call:
    inputs:
      RUN_MODE:
        description: >-
          How the bump is delivered. 'called' opens a pull request against
          BASE_BRANCH, 'local' commits directly on the current branch (monorepo
          pipelines - the new version and the commit SHA are exposed as
          outputs). To bump a chart living in a SEPARATE repository, call
          dispatch-helm-chart.yml instead.
        required: true
        type: string
      CHART_DIR:
        description: Name of the folder containing the chart
        required: false
        type: string
        default: charts
      CHART_NAME:
        description: Name of the chart to update (in CHART_DIR)
        required: true
        type: string
      APP_VERSION:
        description: >-
          The app version to inject in Chart.yaml (appVersion). Leave empty to
          keep the current appVersion - a chart-only release where the chart
          version bumps on its own lifecycle without any app change.
        required: false
        type: string
        default: ""
      UPGRADE_TYPE:
        description: >-
          How the chart version is bumped: 'auto' (default), 'major', 'minor',
          'patch' or 'prerelease'. 'auto' mirrors the app's own bump - the
          level is derived from the appVersion delta (what Chart.yaml holds
          now vs APP_VERSION), and APP_VERSION being a prerelease is what
          selects the prerelease flow - so a single value covers both
          branches of a two-branch pipeline. When there is no delta to read
          (APP_VERSION empty - a chart-only release - or a non-semver current
          appVersion such as 'latest'), 'auto' falls back to a patch bump
          with a warning; pick an explicit level to silence it.
        required: false
        type: string
        default: auto
      PRERELEASE_IDENTIFIER:
        description: >-
          Prerelease identifier, used when the bump enters the prerelease flow
          - UPGRADE_TYPE 'prerelease', or 'auto' with a prerelease APP_VERSION
        required: false
        type: string
        default: rc
      HELM_DOCS_VERSION:
        description: >-
          Version of helm-docs used to regenerate the chart README (e.g.
          'v1.14.2'). Pinned rather than tracking ':latest', so a new upstream
          release cannot silently change what this job runs against your chart.
        required: false
        type: string
        default: v1.14.2
      AUTOMERGE_PRERELEASE:
        description: Automatically merge the PR when the bump is a prerelease (requires APP_CLIENT_ID/APP_PRIVATE_KEY or GH_PAT)
        required: false
        type: boolean
        default: false
      AUTOMERGE_RELEASE:
        description: Automatically merge the PR when the bump is not a prerelease (requires APP_CLIENT_ID/APP_PRIVATE_KEY or GH_PAT)
        required: false
        type: boolean
        default: false
      AUTOMERGE_METHOD:
        description: >-
          How the chart update pull request is merged when automerge is enabled.
          `auto` queues it and lets GitHub merge once required status checks
          pass - this needs "Allow auto-merge" enabled on the repository.
          `admin` merges immediately, bypassing branch protection and required
          status checks. Prefer `auto`; use `admin` only deliberately.
        required: false
        type: string
        default: auto
      BASE_BRANCH:
        description: Base branch to open the chart-update pull request against
        required: false
        type: string
        default: main
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      APP_CLIENT_ID:
        description: >-
          GitHub App Client ID (e.g. Iv23li..., NOT the numeric App ID). Supply
          with APP_PRIVATE_KEY to authenticate as a GitHub App.
          Takes precedence over GH_PAT. Required (with APP_PRIVATE_KEY) or
          GH_PAT for automerge, and to give the chart pull request CI.
          See docs/workflows/05-authentication.md.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Required alongside APP_CLIENT_ID.
        required: false
      GH_PAT:
        description: >-
          GitHub Personal Access Token. Legacy alternative to
          APP_CLIENT_ID/APP_PRIVATE_KEY; still supported, but App authentication is
          preferred.
        required: false
    outputs:
      chart-version:
        description: New chart version computed by the bump
        value: ${{ jobs.update.outputs.chart-version }}
      previous-chart-version:
        description: Chart version before the bump
        value: ${{ jobs.update.outputs.previous-chart-version }}
      commit-sha:
        description: SHA of the bump commit pushed on the current branch (local mode only)
        value: ${{ jobs.update.outputs.commit-sha }}

jobs:
  update:
    name: Update chart
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    # 'local' mode never opens a pull request, but `permissions:` cannot depend
    # on an input - so both scopes are declared and a 'local' caller grants one
    # it will not use. The alternative is duplicating the version-bump logic
    # below into a second workflow, which is the worse trade.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      chart-version: ${{ steps.update-chart.outputs.NEXT_VERSION }}
      previous-chart-version: ${{ steps.update-chart.outputs.CURRENT_VERSION }}
      commit-sha: ${{ steps.push-local.outputs.COMMIT_SHA }}
    env:
      # `secrets` is not available in a step-level `if`, but it is here - so the
      # presence check is hoisted to the job and the step tests `env`.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      # Exactly one of the two set: a typo or a half-finished setup. Never a
      # valid configuration, and silently falling back would downgrade auth.
      HAS_PARTIAL_APP_AUTH: ${{ (secrets.APP_CLIENT_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
    - name: Validate inputs
      env:
        RUN_MODE: ${{ inputs.RUN_MODE }}
        AUTOMERGE_METHOD: ${{ inputs.AUTOMERGE_METHOD }}
        APP_VERSION: ${{ inputs.APP_VERSION }}
        UPGRADE_TYPE: ${{ inputs.UPGRADE_TYPE }}
        PRERELEASE_IDENTIFIER: ${{ inputs.PRERELEASE_IDENTIFIER }}
      run: |
        set -euo pipefail

        if [ "$HAS_PARTIAL_APP_AUTH" = "true" ]; then
          echo "::error::APP_CLIENT_ID and APP_PRIVATE_KEY must be supplied together, but only one was. Continuing would silently fall back to GH_PAT or GITHUB_TOKEN instead of authenticating as the App."
          exit 1
        fi

        # RUN_MODE selects which steps below run: an unrecognised value would
        # skip all of them and still report success - a green run that bumped
        # nothing.
        case "$RUN_MODE" in
          called|local) ;;
          caller)
            echo "::error::RUN_MODE 'caller' belongs to dispatch-helm-chart.yml, which triggers a chart update in a SEPARATE repository. This workflow only bumps a chart in the current one ('called' or 'local')."
            exit 1
            ;;
          *)
            echo "::error::RUN_MODE must be 'called' or 'local', got '$RUN_MODE'"
            exit 1
            ;;
        esac

        case "$AUTOMERGE_METHOD" in
          auto|admin) ;;
          *)
            echo "::error::AUTOMERGE_METHOD must be 'auto' or 'admin', got '$AUTOMERGE_METHOD'"
            exit 1
            ;;
        esac

        # An unrecognised value would fall through to the bump step's own
        # guard, but failing here names the input before any token is minted.
        case "$UPGRADE_TYPE" in
          major|minor|patch|prerelease|auto) ;;
          *)
            echo "::error::UPGRADE_TYPE must be 'major', 'minor', 'patch', 'prerelease' or 'auto', got '$UPGRADE_TYPE'"
            exit 1
            ;;
        esac

        # Both values are written into Chart.yaml, and PRERELEASE_IDENTIFIER
        # additionally becomes part of the chart version and the pull request's
        # branch name. They are written with `yq` + `strenv()` so neither can be
        # interpreted as a program, but they are still constrained here: a value
        # that is not version-shaped is a caller mistake worth failing on, and
        # the two guards are independent on purpose.
        # Matched with bash `=~` rather than `grep -Eq`: grep applies the pattern
        # per line, so a value whose FIRST line is well-formed passes however
        # many lines follow it. bash anchors `^`/`$` to the whole string, and a
        # newline is in neither character class, so a multi-line value is
        # rejected outright.
        if [ -n "$APP_VERSION" ] && [[ ! "$APP_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9.+_-]*$ ]]; then
          echo "::error::APP_VERSION must be a single-line version string matching '^[A-Za-z0-9][A-Za-z0-9.+_-]*\$', got '$APP_VERSION'"
          exit 1
        fi

        if [[ ! "$PRERELEASE_IDENTIFIER" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error::PRERELEASE_IDENTIFIER must match '^[A-Za-z0-9-]+\$', got '$PRERELEASE_IDENTIFIER'"
          exit 1
        fi

    # Minted whenever App auth is configured, for either mode: 'called' needs
    # it for the pull request and the merge, and 'local' needs it for the
    # push below - same precedence as every other credential in this catalog
    # (App, then GITHUB_TOKEN), not a separate opt-in.
    # Scoped to this repository only: passing `owner:` without `repositories:`
    # would widen the token to every repo in the installation.
    - name: Generate GitHub App token
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    # Follows the App token when one was minted above, GITHUB_TOKEN otherwise
    # - the same precedence used everywhere else credentials are chosen in
    # this catalog. For 'called' mode this is inert: that push goes out
    # through create-pull-request's own token, not this checkout's credential.
    # For 'local' mode it is the credential the push below actually uses -
    # which means a caller that supplies APP_CLIENT_ID/APP_PRIVATE_KEY to this
    # job changes that push's behavior: GITHUB_TOKEN cannot trigger a new
    # workflow run, which is what stops the push from re-entering the
    # caller's CD pipeline (e.g. a caller triggering on `push: branches:
    # [main]`); the App token can. Supply App credentials to a 'local'-mode
    # call only once you have confirmed that re-entry is safe for your
    # pipeline - typically because you need the App identity for another
    # reason, such as a branch ruleset that requires a pull request for every
    # push with no exception for GITHUB_TOKEN, which cannot be named in a
    # bypass list the way a GitHub App can.
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token || github.token }}

    - name: update chart version
      id: update-chart
      env:
        CHART_DIR: ${{ inputs.CHART_DIR }}
        CHART_NAME: ${{ inputs.CHART_NAME }}
        APP_VERSION: ${{ inputs.APP_VERSION }}
        UPGRADE_TYPE: ${{ inputs.UPGRADE_TYPE }}
        PRERELEASE_IDENTIFIER: ${{ inputs.PRERELEASE_IDENTIFIER }}
        HELM_DOCS_VERSION: ${{ inputs.HELM_DOCS_VERSION }}
      run: |
        # Remove trailing slashes
        while [ "${CHART_DIR%/}" != "$CHART_DIR" ]; do CHART_DIR="${CHART_DIR%/}"; done

        if [ ! -f "$CHART_DIR/$CHART_NAME/Chart.yaml" ]; then
          echo "Chart.yaml not found in $CHART_DIR/$CHART_NAME"
          exit 1
        fi

        echo "Update chart '$CHART_NAME' in $CHART_DIR/$CHART_NAME with app version '$APP_VERSION'"
        CURRENT_VERSION=$(yq '.version' "$CHART_DIR/$CHART_NAME/Chart.yaml")

        # 'auto' mirrors the app's own bump. The level comes from the
        # appVersion delta - what Chart.yaml holds now vs what is being
        # injected - and APP_VERSION being a prerelease is what selects the
        # prerelease flow, so one caller value covers both branches of a
        # two-branch pipeline. For the explicit types the level is the type
        # itself, which keeps their behavior exactly as it was.
        UPGRADE_LEVEL="$UPGRADE_TYPE"
        EFFECTIVE_TYPE="$UPGRADE_TYPE"
        if [[ "$UPGRADE_TYPE" == "prerelease" ]]; then
          UPGRADE_LEVEL="patch"
        elif [[ "$UPGRADE_TYPE" == "auto" ]]; then
          if [[ -z "$APP_VERSION" ]]; then
            # 'auto' is the default, and a chart-only release is a legitimate
            # use of the default: no delta to read means the smallest bump,
            # stated in the run log rather than failed on.
            echo "::warning::UPGRADE_TYPE=auto has no APP_VERSION to derive a level from (chart-only release) - falling back to a patch bump. Pick an explicit level to silence this."
            UPGRADE_LEVEL="patch"
            EFFECTIVE_TYPE="patch"
          else
            # APP_VERSION was passed by the caller on this very run, so a
            # non-semver value is a mistake worth failing on - unlike the
            # two fallbacks around it, which fault nothing the caller said.
            if [[ ! "$APP_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?(\+.*)?$ ]]; then
              echo "::error::UPGRADE_TYPE=auto derives the bump level from the appVersion delta, but APP_VERSION '$APP_VERSION' is not semver. Pick the level explicitly instead."
              exit 1
            fi
            NEW_APP_MAJOR="${BASH_REMATCH[1]}"
            NEW_APP_MINOR="${BASH_REMATCH[2]}"
            NEW_APP_PRERELEASE="${BASH_REMATCH[5]}"

            # Compared on the base X.Y.Z only: mid-cycle both sides are
            # prereleases, and their identifiers say nothing about the level.
            CURRENT_APP_VERSION=$(yq '.appVersion' "$CHART_DIR/$CHART_NAME/Chart.yaml")
            if [[ "$CURRENT_APP_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]; then
              OLD_APP_MAJOR="${BASH_REMATCH[1]}"
              OLD_APP_MINOR="${BASH_REMATCH[2]}"

              if [[ "$NEW_APP_MAJOR" != "$OLD_APP_MAJOR" ]]; then
                UPGRADE_LEVEL="major"
              elif [[ "$NEW_APP_MINOR" != "$OLD_APP_MINOR" ]]; then
                UPGRADE_LEVEL="minor"
              else
                UPGRADE_LEVEL="patch"
              fi
            else
              # A pre-pipeline chart commonly holds 'latest' here. This run
              # writes a real version into appVersion, so the level is
              # derivable from the next run on; this one bumps patch.
              echo "::warning::the chart's current appVersion '$CURRENT_APP_VERSION' is not semver - no delta to derive a level from, falling back to a patch bump."
              UPGRADE_LEVEL="patch"
            fi

            # The flow still follows APP_VERSION's shape, fallback or not: a
            # prerelease app version must never yield a stable chart version.
            if [[ -n "$NEW_APP_PRERELEASE" ]]; then
              EFFECTIVE_TYPE="prerelease"
            else
              EFFECTIVE_TYPE="$UPGRADE_LEVEL"
            fi
            echo "auto: app '$CURRENT_APP_VERSION' -> '$APP_VERSION' implies a $UPGRADE_LEVEL bump ($EFFECTIVE_TYPE flow)"
          fi
        fi

        # Bump version using Release Please compatible logic
        if [[ "$EFFECTIVE_TYPE" == "prerelease" ]]; then
          # Parse version: extract base version and prerelease part
          if [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(.+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRERELEASE="${BASH_REMATCH[5]}"

            if [[ -z "$PRERELEASE" ]]; then
              # No prerelease: bump the base by the level, then open the
              # cycle with the bare identifier (e.g. 1.2.3 -> 1.2.4-rc, or
              # 1.2.3 -> 1.3.0-rc when the app bumped minor under 'auto')
              case "$UPGRADE_LEVEL" in
                major) NEXT_VERSION="$((MAJOR + 1)).0.0-$PRERELEASE_IDENTIFIER" ;;
                minor) NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0-$PRERELEASE_IDENTIFIER" ;;
                patch) NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-$PRERELEASE_IDENTIFIER" ;;
              esac
            else
              # Has prerelease: extract current identifier. Same character
              # class as the PRERELEASE_IDENTIFIER validation - anything the
              # workflow can write, it must be able to read back on the next
              # run.
              if [[ "$PRERELEASE" =~ ^([A-Za-z0-9-]+)(\.([0-9]+))?$ ]]; then
                CURRENT_IDENTIFIER="${BASH_REMATCH[1]}"
                CURRENT_NUM="${BASH_REMATCH[3]}"

                if [[ "$CURRENT_IDENTIFIER" != "$PRERELEASE_IDENTIFIER" ]]; then
                  # Different identifier: switch to new identifier without number
                  # e.g., 1.0.0-alpha.2 -> 1.0.0-beta
                  NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}-$PRERELEASE_IDENTIFIER"
                elif [[ "$UPGRADE_LEVEL" == "major" ]] && [[ "$MINOR" -ne 0 || "$PATCH" -ne 0 ]]; then
                  # The cycle's base does not encode the level yet: bump it
                  # and carry the prerelease part verbatim - the same
                  # escalation release-please applies to the app version when
                  # a feat lands mid-cycle (e.g. 1.2.4-rc.2 -> 2.0.0-rc.2).
                  NEXT_VERSION="$((MAJOR + 1)).0.0-${PRERELEASE}"
                elif [[ "$UPGRADE_LEVEL" == "minor" && "$PATCH" -ne 0 ]]; then
                  # e.g. 1.2.4-rc.2 -> 1.3.0-rc.2
                  NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0-${PRERELEASE}"
                elif [[ -z "$CURRENT_NUM" ]]; then
                  # Same identifier without number: add .1
                  # e.g., 1.0.0-rc -> 1.0.0-rc.1
                  NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}-$PRERELEASE_IDENTIFIER.1"
                else
                  # Same identifier with number: increment
                  # e.g., 1.0.0-rc.1 -> 1.0.0-rc.2
                  NEXT_NUM=$((CURRENT_NUM + 1))
                  NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}-$PRERELEASE_IDENTIFIER.${NEXT_NUM}"
                fi
              else
                echo "Unexpected prerelease format: $PRERELEASE"
                exit 1
              fi
            fi
          else
            echo "Invalid version format: $CURRENT_VERSION"
            exit 1
          fi
        else
          # Standard version bump (major, minor, patch)
          if [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(.+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRERELEASE="${BASH_REMATCH[5]}"

            if [[ -n "$PRERELEASE" ]]; then
              # Has prerelease: release the official version without
              # prerelease - the level was already baked into the base when
              # the cycle was entered or escalated
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            else
              # No prerelease: perform standard version bump
              case "$EFFECTIVE_TYPE" in
                major)
                  NEXT_VERSION="$((MAJOR + 1)).0.0"
                  ;;
                minor)
                  NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
                  ;;
                patch)
                  NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                  ;;
                *)
                  echo "Invalid upgrade type: $UPGRADE_TYPE"
                  exit 1
                  ;;
              esac
            fi
          else
            echo "Invalid version format: $CURRENT_VERSION"
            exit 1
          fi
        fi

        echo "Update chart from version '$CURRENT_VERSION' to '$NEXT_VERSION'"

        echo "Update chart files..."
        # Written with yq, not sed. Both values reach this step from workflow
        # inputs, and a sed replacement is a *program*: a `/` in the value closes
        # the s/// command and what follows is parsed as further sed commands -
        # including GNU sed's `e`, which executes its argument through a shell.
        # `strenv()` passes the value through the environment as a string, so it
        # can only ever be stored, never interpreted. The inputs are validated
        # too (see "Validate inputs"); this is the half that cannot be bypassed.
        export NEXT_VERSION
        if [ -n "$APP_VERSION" ]; then
          # Empty APP_VERSION = chart-only release: the chart version bumps on
          # its own lifecycle and the current appVersion is left untouched
          yq -i '.appVersion = strenv(APP_VERSION)' "$CHART_DIR/$CHART_NAME/Chart.yaml"
        fi
        yq -i '.version = strenv(NEXT_VERSION)' "$CHART_DIR/$CHART_NAME/Chart.yaml"

        echo "Generate chart documentation..."
        docker run \
          --rm \
          --volume "$(pwd)/$CHART_DIR/$CHART_NAME:/helm-docs" \
          -u "$(id -u)" \
          "docker.io/jnorwood/helm-docs:$HELM_DOCS_VERSION"

        {
          echo "CURRENT_VERSION=$CURRENT_VERSION"
          echo "NEXT_VERSION=$NEXT_VERSION"
          echo "BRANCH_NAME=$CHART_NAME-v$NEXT_VERSION"
          # The resolved flow, for the automerge gate: under 'auto' the INPUT
          # never says 'prerelease' even when the bump is one, so gating on
          # the input would route every rc bump through AUTOMERGE_RELEASE.
          echo "EFFECTIVE_TYPE=$EFFECTIVE_TYPE"
        } >> "$GITHUB_OUTPUT"

    - name: Commit and push chart bump
      id: push-local
      if: ${{ inputs.RUN_MODE == 'local' }}
      env:
        CHART_DIR: ${{ inputs.CHART_DIR }}
        CHART_NAME: ${{ inputs.CHART_NAME }}
        NEXT_VERSION: ${{ steps.update-chart.outputs.NEXT_VERSION }}
      run: |
        set -euo pipefail

        CHART_DIR="${CHART_DIR%/}"
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

        git add "$CHART_DIR/$CHART_NAME"
        # No [skip ci] here on purpose. Without App credentials supplied to
        # this job, this push cannot trigger a new workflow run - on push OR
        # pull_request - because it goes out on the checkout's own
        # GITHUB_TOKEN (see the checkout step above): GitHub never lets
        # GITHUB_TOKEN-authenticated activity create a new run, which is what
        # actually prevents the CD loop. Supplying
        # APP_CLIENT_ID/APP_PRIVATE_KEY trades that protection away by the
        # caller's own choice - re-entry is then a risk they have already
        # accepted, not one [skip ci] should paper over here.
        # [skip ci] would add nothing on the GITHUB_TOKEN path either way,
        # while silently breaking something else: it is matched on the commit
        # MESSAGE alone, regardless of which credential wrote it, so it would
        # also suppress pull_request checks for any pull request a human
        # later opens FROM this branch (e.g. a manual develop -> main
        # promotion) - the tip is exactly this commit until the next one
        # lands. That pull request opening is a human action authenticated
        # with the human's own credentials, not GITHUB_TOKEN, so nothing else
        # would stop it from getting real checks - don't reintroduce
        # [skip ci] here.
        # The `chore(chart):` prefix is the other guard: release-please does
        # not cut a release from it.
        git commit -m "chore(chart): release $CHART_NAME $NEXT_VERSION"

        # Tolerate concurrent pushes from other jobs of the same pipeline
        git pull --rebase origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"

        echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Create pull request
      id: create-pr
      if: ${{ inputs.RUN_MODE == 'called' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
      with:
        # App token, then GH_PAT, then GITHUB_TOKEN. The first two can trigger
        # workflows, so the chart update pull request actually gets CI; under
        # GITHUB_TOKEN it never did.
        token: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
        branch: ${{ steps.update-chart.outputs.BRANCH_NAME }}
        base: ${{ inputs.BASE_BRANCH }}
        title: "${{ inputs.APP_VERSION != '' && format('Update chart {0} app to v{1}', inputs.CHART_NAME, inputs.APP_VERSION) || format('Update chart {0} to v{1}', inputs.CHART_NAME, steps.update-chart.outputs.NEXT_VERSION) }}"
        add-paths: |
          **/**
        commit-message: "${{ inputs.APP_VERSION != '' && format('chore: update chart {0} app to v{1}', inputs.CHART_NAME, inputs.APP_VERSION) || format('chore: update chart {0} to v{1}', inputs.CHART_NAME, steps.update-chart.outputs.NEXT_VERSION) }}"
        draft: false
        body: |
          🤖 This PR has been automatically generated, please check updates before merging.

          - Chart version has been updated from `${{ steps.update-chart.outputs.CURRENT_VERSION }}` to `${{ steps.update-chart.outputs.NEXT_VERSION }}`
          ${{ inputs.APP_VERSION != '' && format('- App version has been updated to `{0}`', inputs.APP_VERSION) || '- App version has been left unchanged (chart-only release)' }}
          - Chart documentation has been regenerated

    # Gated on the RESOLVED flow (EFFECTIVE_TYPE), not the UPGRADE_TYPE input:
    # under 'auto' the input never says 'prerelease', so an input-based gate
    # would treat every rc bump as a release - inverting the standard
    # "automerge the noisy rc bumps, review the real releases" configuration.
    - name: Automerge chart update PR
      if: ${{ ((inputs.AUTOMERGE_PRERELEASE && steps.update-chart.outputs.EFFECTIVE_TYPE == 'prerelease') || (inputs.AUTOMERGE_RELEASE && steps.update-chart.outputs.EFFECTIVE_TYPE != 'prerelease')) && steps.create-pr.outputs.pull-request-number }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT }}
        # Repository metadata is read with the built-in token, which always has
        # access to its own repo - a narrowly scoped PAT or App token may not.
        METADATA_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        # Already validated by the 'Validate inputs' step at the top of this job.
        AUTOMERGE_METHOD: ${{ inputs.AUTOMERGE_METHOD }}
      run: |
        set -euo pipefail

        # Automerge is gated on the AUTOMERGE_* inputs above, never on whether a
        # credential happens to be present. Supplying APP_CLIENT_ID must not
        # silently switch merging on, and a caller that asked to merge and
        # silently did not has a broken release - so this fails loudly.
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Automerge is enabled but no credential was supplied. Pass APP_CLIENT_ID/APP_PRIVATE_KEY (preferred) or GH_PAT."
          exit 1
        fi

        echo "Merging PR #$PR_NUMBER using method '$AUTOMERGE_METHOD'"

        if [ "$AUTOMERGE_METHOD" = "admin" ]; then
          echo "::warning::Force-merging PR #$PR_NUMBER, bypassing branch protection and required status checks (AUTOMERGE_METHOD=admin)"
          gh pr merge "$PR_NUMBER" --rebase --admin
          exit 0
        fi

        # `--auto` needs "Allow auto-merge" on the repository. Fail with a
        # pointed message rather than silently falling back to --admin, which
        # would merge past the very checks the App token now makes run.
        automerge_allowed=$(GH_TOKEN="$METADATA_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')
        if [ "$automerge_allowed" != "true" ]; then
          echo "::error::AUTOMERGE_METHOD=auto requires 'Allow auto-merge' in Settings > General on '$GITHUB_REPOSITORY'. Enable it, or set AUTOMERGE_METHOD=admin to force-merge past branch protection."
          exit 1
        fi

        gh pr merge "$PR_NUMBER" --rebase --auto
