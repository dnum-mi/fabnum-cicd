name: Trivy scan

on:
  workflow_call:
    inputs:
      IMAGE:
        description: Image used to perform scan (eg. docker.io/debian:latest)
        required: false
        type: string
      IMAGE_ARTIFACT:
        description: >-
          Name of a workflow artifact holding an image tarball to scan locally, instead of
          pulling IMAGE from a registry (e.g. produced by 'build-docker.yml' with PUSH set
          to false). Takes precedence over IMAGE when both are set.
        required: false
        type: string
      IMAGE_ARTIFACT_FILE:
        description: Name of the tarball file inside IMAGE_ARTIFACT
        required: false
        type: string
        default: image.tar

      PATH:
        description: Path used to perform scan
        required: false
        type: string
      FORMAT:
        description: Format of the report (sarif, table, json, ...)
        required: false
        type: string
        default: table
      PR_NUMBER:
        description: Number of the pull request to post the scan summary comment on
        required: false
        type: string
      GITHUB_SECURITY_TAB:
        description: Whether to link to GitHub Security Tab in the PR comment
        required: false
        default: false
        type: boolean
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username used to login into registry
        required: false
      REGISTRY_PASSWORD:
        description: Password used to login into registry
        required: false

jobs:
  images-scan:
    name: Scan images vulnerabilities
    if: ${{ inputs.IMAGE != '' || inputs.IMAGE_ARTIFACT != '' }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      security-events: write
      packages: read
    env:
      # Label used in the summary/warning messages, since the scan target can be
      # either a registry reference or a locally downloaded tarball
      SCAN_TARGET: ${{ inputs.IMAGE_ARTIFACT != '' && format('artifact {0}', inputs.IMAGE_ARTIFACT) || inputs.IMAGE }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download image artifact
      if: ${{ inputs.IMAGE_ARTIFACT != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.IMAGE_ARTIFACT }}
        path: /tmp/trivy-image

    - name: Run Trivy vulnerability scanner on images
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.IMAGE_ARTIFACT == '' && inputs.IMAGE || '' }}
        input: ${{ inputs.IMAGE_ARTIFACT != '' && format('/tmp/trivy-image/{0}', inputs.IMAGE_ARTIFACT_FILE) || '' }}
        format: ${{ inputs.FORMAT }}
        vuln-type: "os,library"
        ignore-unfixed: true
        output: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        github-pat: ${{ github.token }}
      env:
        TRIVY_USERNAME: ${{ startsWith(inputs.IMAGE, 'ghcr.io') && github.actor || secrets.REGISTRY_USERNAME }}
        TRIVY_PASSWORD: ${{ startsWith(inputs.IMAGE, 'ghcr.io') && github.token || secrets.REGISTRY_PASSWORD }}
      continue-on-error: true

    - name: Print Trivy scan results
      # Guard on the scan outcome: a failed scan writes no report file, and a
      # missing file would fail this step and skip the warning step below
      if: ${{ inputs.FORMAT == 'table' && steps.scan.outcome == 'success' }}
      run: |
        echo "## Trivy Scan Results for image '${SCAN_TARGET}'" >> $GITHUB_STEP_SUMMARY
        echo '---' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat ${{ format('trivy-results.{0}', inputs.FORMAT) }} >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Trivy scan results to GitHub Security tab
      id: upload
      uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
      if: ${{ inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif' }}
      with:
        sarif_file: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
      continue-on-error: true

    - name: Warn about error
      # Every scan/upload step above is continue-on-error, so job.status stays
      # 'success' and failure() never fires - key off the step outcomes instead
      if: ${{ steps.scan.outcome == 'failure' || steps.upload.outcome == 'failure' }}
      run: |
        echo ":warning: The Trivy scan report for image \`${SCAN_TARGET}\` was not successfully completed and could not be uploaded to the GitHub Security Panel." >> "$GITHUB_STEP_SUMMARY"

  config-scan:
    name: Scan config files vulnerabilities
    if: ${{ inputs.PATH != '' }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Trivy vulnerability scanner on config files
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-ref: "${{ inputs.PATH }}"
        scan-type: config
        format: ${{ inputs.FORMAT }}
        skip-dirs: "**/node_modules"
        ignore-unfixed: true
        output: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        github-pat: ${{ github.token }}
      continue-on-error: true

    - name: Print Trivy scan results
      # Guard on the scan outcome: a failed scan writes no report file, and a
      # missing file would fail this step and skip the warning step below
      if: ${{ inputs.FORMAT == 'table' && steps.scan.outcome == 'success' }}
      run: |
        echo "## Trivy Scan Results for path '${{ inputs.PATH }}'" >> $GITHUB_STEP_SUMMARY
        echo '---' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat ${{ format('trivy-results.{0}', inputs.FORMAT) }} >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Trivy scan results to GitHub Security tab
      id: upload
      uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
      if: ${{ inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif' }}
      with:
        sarif_file: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
      continue-on-error: true

    - name: Warn about error
      # Every scan/upload step above is continue-on-error, so job.status stays
      # 'success' and failure() never fires - key off the step outcomes instead
      if: ${{ steps.scan.outcome == 'failure' || steps.upload.outcome == 'failure' }}
      run: |
        echo ":warning: The Trivy scan report for configuration was not successfully completed and could not be uploaded to the GitHub Security Panel." >> "$GITHUB_STEP_SUMMARY"

  scan-notif:
    name: Notify users
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      pull-requests: write
    if: ${{ always() && (needs.images-scan.result == 'success' || needs.config-scan.result == 'success') }}
    needs:
    - images-scan
    - config-scan
    steps:
    - name: Comment PR
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      if: ${{ inputs.PR_NUMBER != '' }}
      with:
        message: |
          🤖 Hey !

          The security scan report for the current pull request is available in ${{ (inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif') && format('[the GitHub Security Tab](https://github.com/{0}/security/code-scanning?query=is%3Aopen+branch%3A{1}+pr%3A{2})', github.repository, github.ref_name, (github.event.pull_request.number || github.event.number)) || format('[the GitHub Workflow Summary](https://github.com/{0}/actions/runs/{1})', github.repository, github.run_id) }}.
        comment-tag: vuln-scan
        pr-number: ${{ inputs.PR_NUMBER }}
