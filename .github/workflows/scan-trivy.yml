name: Trivy scan

on:
  workflow_call:
    inputs:
      IMAGE:
        description: Image used to perform scan (eg. docker.io/debian:latest)
        required: false
        type: string
      IMAGE_ARTIFACT:
        description: >-
          Name of a workflow artifact holding an image tarball to scan locally, instead of
          pulling IMAGE from a registry (e.g. produced by 'build-docker.yml' with PUSH set
          to false). Takes precedence over IMAGE when both are set.
        required: false
        type: string
      IMAGE_ARTIFACT_FILE:
        description: Name of the tarball file inside IMAGE_ARTIFACT
        required: false
        type: string
        default: image.tar
      PATH:
        description: Path used to perform scan
        required: false
        type: string
      FORMAT:
        description: Format of the report (sarif, table, json, ...)
        required: false
        type: string
        default: table
      PR_NUMBER:
        description: Number of the pull request to post the scan summary comment on
        required: false
        type: string
      GITHUB_SECURITY_TAB:
        description: Whether to link to GitHub Security Tab in the PR comment
        required: false
        default: false
        type: boolean
      TRIVYIGNORES:
        description: >-
          Comma separated paths to Trivy ignore files, relative to the repository
          root (e.g. '.trivyignore.yaml'). Trivy auto-detects a plain
          '.trivyignore', but the YAML form - the only one supporting per-path
          scoping and a documented reason per entry - has to be named explicitly.
        required: false
        type: string
      CATEGORY:
        description: >-
          Code scanning category for the SARIF upload. Set a distinct value per
          target when several callers upload from the same repository (e.g. one
          matrix leg per image) - uploads sharing a category replace one another,
          leaving only whichever finished last.
        required: false
        type: string
      SEVERITY:
        description: >-
          Comma separated severities to report (e.g. 'CRITICAL,HIGH'). Empty
          reports every severity Trivy knows about.
        required: false
        type: string
      FAIL_ON_ERROR:
        description: Whether to fail the workflow when vulnerabilities are found
        type: boolean
        required: false
        default: false
      TIMEOUT:
        description: >-
          Trivy scan timeout as a Go duration (e.g. '15m'). Trivy defaults to 5m,
          which a large image can exceed while analysing a single big statically
          linked binary. That failure is total rather than partial - the scan
          aborts with a context deadline error and writes no report at all - so
          it reads as a broken scan rather than as a slow one.
        required: false
        type: string
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username used to login into registry
        required: false
      REGISTRY_PASSWORD:
        description: Password used to login into registry
        required: false
      APP_CLIENT_ID:
        description: >-
          GitHub App Client ID (e.g. Iv23li..., NOT the numeric App ID). Supply
          with APP_PRIVATE_KEY to raise the API budget Trivy uses to fetch its
          vulnerability database from 1,000 to 5,000 requests/hour. The token is
          minted read-only. See docs/workflows/05-authentication.md.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Required alongside APP_CLIENT_ID.
        required: false
      GH_PAT:
        description: >-
          Personal access token, used for the same purpose as the App
          credentials above and resolved after them. Read-only access is
          sufficient - a fine-grained token with Contents: read is enough.
        required: false

jobs:
  images-scan:
    name: Scan images vulnerabilities
    if: ${{ inputs.IMAGE != '' || inputs.IMAGE_ARTIFACT != '' }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      security-events: write
      packages: read
    env:
      # Label used in the summary/warning messages, since the scan target can be
      # either a registry reference or a locally downloaded tarball
      SCAN_TARGET: ${{ inputs.IMAGE_ARTIFACT != '' && format('artifact {0}', inputs.IMAGE_ARTIFACT) || inputs.IMAGE }}
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      # Exactly one of the two set: a typo or a half-finished setup. Never a
      # valid configuration, and silently falling back would downgrade auth.
      HAS_PARTIAL_APP_AUTH: ${{ (secrets.APP_CLIENT_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
    - name: Validate credentials
      run: |
        set -euo pipefail

        if [ "$HAS_PARTIAL_APP_AUTH" = "true" ]; then
          echo "::error::APP_CLIENT_ID and APP_PRIVATE_KEY must be supplied together, but only one was. Continuing would silently fall back to GH_PAT or GITHUB_TOKEN instead of authenticating as the App."
          exit 1
        fi

    # Read-only: this token only raises the API budget for Trivy's database
    # download. The permission-* narrowing is load-bearing - a mint without it
    # inherits every permission the installation holds.
    - name: Generate read-only GitHub App token
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: read
        permission-metadata: read

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Download image artifact
      if: ${{ inputs.IMAGE_ARTIFACT != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.IMAGE_ARTIFACT }}
        path: /tmp/trivy-image

    - name: Run Trivy vulnerability scanner on images
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ inputs.IMAGE_ARTIFACT == '' && inputs.IMAGE || '' }}
        input: ${{ inputs.IMAGE_ARTIFACT != '' && format('/tmp/trivy-image/{0}', inputs.IMAGE_ARTIFACT_FILE) || '' }}
        format: ${{ inputs.FORMAT }}
        vuln-type: "os,library"
        ignore-unfixed: true
        # Falls back to trivy-action's own default rather than passing an empty
        # string, so existing callers that never set SEVERITY are unaffected
        severity: ${{ inputs.SEVERITY || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}
        exit-code: ${{ inputs.FAIL_ON_ERROR && '1' || '0' }}
        output: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        trivyignores: ${{ inputs.TRIVYIGNORES }}
        timeout: ${{ inputs.TIMEOUT }}
        github-pat: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
      env:
        TRIVY_USERNAME: ${{ startsWith(inputs.IMAGE, 'ghcr.io') && github.actor || secrets.REGISTRY_USERNAME }}
        TRIVY_PASSWORD: ${{ startsWith(inputs.IMAGE, 'ghcr.io') && github.token || secrets.REGISTRY_PASSWORD }}
      # Constant, never an expression. `continue-on-error: ${{ !inputs.FAIL_ON_ERROR }}`
      # silently resolved to true even with FAIL_ON_ERROR set, so the scan exited 1
      # on real findings and the job still reported success - the gate was a no-op
      # for every caller. The report and the upload have to run after a failed scan
      # either way, so the step always continues and the gate is an explicit step
      # below, the same shape scan-gitleaks.yml already uses.
      continue-on-error: true

    - name: Print Trivy scan results
      id: report
      # Runs even when the scan step failed: with FAIL_ON_ERROR the scan exits
      # non-zero precisely when there is something worth reading, and the report
      # is still written. A failed scan that produced no file is skipped rather
      # than erroring, so the warning step below still gets a chance to run.
      if: ${{ !cancelled() && inputs.FORMAT == 'table' && steps.scan.outcome != 'skipped' }}
      env:
        REPORT_FILE: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
      run: |
        [ -f "$REPORT_FILE" ] || exit 0
        # GITHUB_STEP_SUMMARY is capped at 1 MiB and a write over the cap is
        # dropped whole, not trimmed - a broad scan of a large image would lose
        # its entire summary rather than the tail of one table. The budget leaves
        # room for the heading, the fences and the note below.
        BUDGET=900000
        {
          echo "## Trivy Scan Results for image '${SCAN_TARGET}'"
          echo '---'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$(wc -c < "$REPORT_FILE")" -gt "$BUDGET" ]; then
          head -c "$BUDGET" "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '```'
            echo '> [!NOTE]'
            echo '> Truncated to fit the 1 MiB step summary limit - the complete'
            echo '> report is attached to this run as an artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "truncated=true" >> "$GITHUB_OUTPUT"
        else
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi
        # Artifact names reject the ':' and '/' a registry reference is full of
        printf 'slug=%s\n' "$(printf '%s' "${SCAN_TARGET}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

    - name: Upload the complete Trivy report
      # Only when the summary could not hold it - otherwise the summary already
      # is the report and an artifact is a second copy nobody opens
      if: ${{ !cancelled() && steps.report.outputs.truncated == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: trivy-report-${{ steps.report.outputs.slug }}
        path: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        retention-days: 7
      continue-on-error: true

    - name: Upload Trivy scan results to GitHub Security tab
      id: upload
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
      if: ${{ !cancelled() && inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif' && steps.scan.outcome != 'skipped' }}
      with:
        sarif_file: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        category: ${{ inputs.CATEGORY }}
      continue-on-error: true

    - name: Warn about error
      # Every scan/upload step above is continue-on-error, so job.status stays
      # 'success' and failure() never fires - key off the step outcomes instead.
      # Under FAIL_ON_ERROR a failed scan usually means findings rather than a
      # broken scan, and the gate below reports that - so this only speaks up
      # about the scan when it is not gating.
      if: ${{ (!inputs.FAIL_ON_ERROR && steps.scan.outcome == 'failure') || steps.upload.outcome == 'failure' }}
      run: |
        echo ":warning: The Trivy scan report for image \`${SCAN_TARGET}\` was not successfully completed and could not be uploaded to the GitHub Security Panel." >> "$GITHUB_STEP_SUMMARY"

    - name: Fail on detected vulnerabilities
      # The scan only exits non-zero under FAIL_ON_ERROR (exit-code is 0 otherwise),
      # so reporting-only callers never reach this
      if: ${{ inputs.FAIL_ON_ERROR && steps.scan.outcome == 'failure' }}
      run: |
        echo "::error::Trivy found vulnerabilities in ${SCAN_TARGET}, or the scan did not complete."
        exit 1

  config-scan:
    name: Scan config files vulnerabilities
    if: ${{ inputs.PATH != '' }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      security-events: write
    env:
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      # Exactly one of the two set: a typo or a half-finished setup. Never a
      # valid configuration, and silently falling back would downgrade auth.
      HAS_PARTIAL_APP_AUTH: ${{ (secrets.APP_CLIENT_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
    - name: Validate credentials
      run: |
        set -euo pipefail

        if [ "$HAS_PARTIAL_APP_AUTH" = "true" ]; then
          echo "::error::APP_CLIENT_ID and APP_PRIVATE_KEY must be supplied together, but only one was. Continuing would silently fall back to GH_PAT or GITHUB_TOKEN instead of authenticating as the App."
          exit 1
        fi

    # Read-only: this token only raises the API budget for Trivy's database
    # download. The permission-* narrowing is load-bearing - a mint without it
    # inherits every permission the installation holds.
    - name: Generate read-only GitHub App token
      id: app-token
      if: ${{ env.HAS_APP_AUTH == 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: read
        permission-metadata: read

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Run Trivy vulnerability scanner on config files
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-ref: "${{ inputs.PATH }}"
        scan-type: config
        format: ${{ inputs.FORMAT }}
        skip-dirs: "**/node_modules"
        ignore-unfixed: true
        # Falls back to trivy-action's own default rather than passing an empty
        # string, so existing callers that never set SEVERITY are unaffected
        severity: ${{ inputs.SEVERITY || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}
        exit-code: ${{ inputs.FAIL_ON_ERROR && '1' || '0' }}
        output: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        trivyignores: ${{ inputs.TRIVYIGNORES }}
        timeout: ${{ inputs.TIMEOUT }}
        github-pat: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
      # See the image scan above for why this is constant rather than an expression
      continue-on-error: true

    - name: Print Trivy scan results
      id: report
      # See the image scan above: runs even on a failed scan, since that is
      # exactly when FAIL_ON_ERROR has something worth printing
      if: ${{ !cancelled() && inputs.FORMAT == 'table' && steps.scan.outcome != 'skipped' }}
      env:
        REPORT_FILE: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        SCAN_PATH: ${{ inputs.PATH }}
      run: |
        [ -f "$REPORT_FILE" ] || exit 0
        # See the image scan above for why this is truncated rather than cat'd
        BUDGET=900000
        {
          echo "## Trivy Scan Results for path '${SCAN_PATH}'"
          echo '---'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$(wc -c < "$REPORT_FILE")" -gt "$BUDGET" ]; then
          head -c "$BUDGET" "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '```'
            echo '> [!NOTE]'
            echo '> Truncated to fit the 1 MiB step summary limit - the complete'
            echo '> report is attached to this run as an artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "truncated=true" >> "$GITHUB_OUTPUT"
        else
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi
        # Artifact names reject the ':' and '/' a registry reference is full of
        printf 'slug=%s\n' "$(printf '%s' "${SCAN_PATH}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

    - name: Upload the complete Trivy report
      # See the image scan above
      if: ${{ !cancelled() && steps.report.outputs.truncated == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: trivy-report-${{ steps.report.outputs.slug }}
        path: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        retention-days: 7
      continue-on-error: true

    - name: Upload Trivy scan results to GitHub Security tab
      id: upload
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
      if: ${{ !cancelled() && inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif' && steps.scan.outcome != 'skipped' }}
      with:
        sarif_file: ${{ format('trivy-results.{0}', inputs.FORMAT) }}
        category: ${{ inputs.CATEGORY }}
      continue-on-error: true

    - name: Warn about error
      # See the image scan above: only speaks up about the scan when not gating,
      # since under FAIL_ON_ERROR the gate below reports it instead
      if: ${{ (!inputs.FAIL_ON_ERROR && steps.scan.outcome == 'failure') || steps.upload.outcome == 'failure' }}
      run: |
        echo ":warning: The Trivy scan report for configuration was not successfully completed and could not be uploaded to the GitHub Security Panel." >> "$GITHUB_STEP_SUMMARY"

    - name: Fail on detected vulnerabilities
      # See the image scan above
      if: ${{ inputs.FAIL_ON_ERROR && steps.scan.outcome == 'failure' }}
      env:
        SCAN_PATH: ${{ inputs.PATH }}
      run: |
        echo "::error::Trivy found misconfigurations under ${SCAN_PATH}, or the scan did not complete."
        exit 1

  scan-notif:
    name: Notify users
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      pull-requests: write
    if: ${{ always() && (needs.images-scan.result == 'success' || needs.config-scan.result == 'success') }}
    needs:
    - images-scan
    - config-scan
    steps:
    - name: Comment PR
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
      if: ${{ inputs.PR_NUMBER != '' }}
      with:
        # Only `pr:` here: on a pull_request event `github.ref_name` is
        # `<N>/merge`, which the code scanning search does not resolve to a
        # branch - ANDed with `pr:` it matches nothing and hides the very
        # alerts the link points at.
        message: |
          🤖 Hey !

          The security scan report for the current pull request is available in ${{ (inputs.GITHUB_SECURITY_TAB && inputs.FORMAT == 'sarif') && format('[the GitHub Security Tab](https://github.com/{0}/security/code-scanning?query=is%3Aopen+pr%3A{1})', github.repository, inputs.PR_NUMBER) || format('[the GitHub Workflow Summary](https://github.com/{0}/actions/runs/{1})', github.repository, github.run_id) }}.
        header: vuln-scan
        # Not `number`: that one is only a fallback the event payload overrides,
        # and the caller naming a pull request has to be what decides.
        number_force: ${{ inputs.PR_NUMBER }}
