name: Docker build

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: Name of the image to build (eg. 'ghcr.io/my-org/my-image')
        required: true
        type: string
      IMAGE_TAG:
        description: Tag used to build image
        required: true
        type: string
      LATEST_TAG:
        description: Whether to tag the image with 'latest'
        required: false
        default: false
        type: boolean
      IMAGE_DOCKERFILE:
        description: Path of the dockerfile to build image
        required: true
        type: string
      IMAGE_CONTEXT:
        description: Path of the context to build image
        required: true
        type: string
      IMAGE_TARGET:
        description: Target stage to build in the Dockerfile (optional, builds the last stage if not set)
        required: false
        type: string
      TAG_MAJOR_AND_MINOR:
        description: Whether to tag with only major and minor tags (e.g. '1.2.3' -> '1.2' & '1')
        required: false
        default: false
        type: boolean
      BUILD_AMD64:
        description: Build for amd64
        required: false
        default: true
        type: boolean
      BUILD_ARM64:
        description: Build for arm64
        required: false
        default: true
        type: boolean
      USE_QEMU:
        description: Use QEMU emulator for arm64
        required: false
        default: false
        type: boolean
      BUILD_ARGS:
        description: Newline-separated list of Docker build args (e.g. 'MY_ARG=value')
        required: false
        type: string
      PUSH_IMAGE:
        description: Whether to push the built image to the registry
        required: false
        default: true
        type: boolean
      CACHE:
        description: Enable Docker build cache (uses GitHub Actions cache backend)
        required: false
        default: false
        type: boolean
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    outputs:
      digest:
        description: Digest of the built image (sha256:...)
        value: ${{ jobs.merge.outputs.digest }}
      image:
        description: Normalized image name (lowercase, registry-compatible)
        value: ${{ jobs.infos.outputs.normalized-image }}
    secrets:
      REGISTRY_USERNAME:
        description: Username used to login into registry
        required: false
      REGISTRY_PASSWORD:
        description: Password used to login into registry
        required: false

jobs:
  infos:
    name: Get build infos
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    outputs:
      registry: ${{ steps.infos.outputs.REGISTRY }}
      normalized-image: ${{ steps.infos.outputs.NORMALIZED_IMAGE }}
      lower-image: ${{ steps.infos.outputs.LOWER_IMAGE }}
      major-tag: ${{ steps.infos.outputs.MAJOR_TAG }}
      minor-tag: ${{ steps.infos.outputs.MINOR_TAG }}
      patch-tag: ${{ steps.infos.outputs.PATCH_TAG }}
      prerelease-tag: ${{ steps.infos.outputs.PRERELEASE_TAG }}
      short-sha: ${{ steps.infos.outputs.SHORT_SHA }}
      lower-branch: ${{ steps.infos.outputs.LOWER_BRANCH }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Get infos
      id: infos
      env:
        INPUT_IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
        INPUT_IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        INPUT_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        # Normalize image name: lowercase and replace _ with -
        NORMALIZED_IMAGE=$(echo "$INPUT_IMAGE_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')
        echo "NORMALIZED_IMAGE=$NORMALIZED_IMAGE" >> $GITHUB_OUTPUT
        echo "REGISTRY=$(echo "$INPUT_IMAGE_NAME" | cut -d "/" -f 1 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        echo "LOWER_IMAGE=$(echo "$INPUT_IMAGE_NAME" | cut -d "/" -f 2- | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')" >> $GITHUB_OUTPUT
        if [[ "$INPUT_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          VERSION_TAG=$(echo "$INPUT_IMAGE_TAG" | sed 's/-.*$//')
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "PRERELEASE_TAG=$(echo "$INPUT_IMAGE_TAG" | sed -n 's/^[0-9.]*-\(.*\)$/\1/p')" >> $GITHUB_OUTPUT
          echo "MAJOR_TAG=$(echo $VERSION_TAG | cut -d "." -f 1)" >> $GITHUB_OUTPUT
          echo "MINOR_TAG=$(echo $VERSION_TAG | cut -d "." -f 2)" >> $GITHUB_OUTPUT
          echo "PATCH_TAG=$(echo $VERSION_TAG | cut -d "." -f 3)" >> $GITHUB_OUTPUT
        fi
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "LOWER_BRANCH=$(echo "$INPUT_HEAD_REF" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  build:
    name: Build application
    runs-on: ${{ matrix.runners }}
    permissions:
      packages: write
      contents: read
    needs:
    - infos
    strategy:
      matrix:
        # Case 1: both native  → one AMD64 + one ARM64 runner
        # Case 2: both QEMU   → single AMD64 runner builds linux/amd64,linux/arm64
        # Case 3: ARM64 QEMU  → single AMD64 runner builds linux/arm64 via QEMU
        # Case 4: ARM64 native → single ARM64 runner
        # Case 5: AMD64 only / fallback → single AMD64 runner
        runners: ${{ (inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && !inputs.USE_QEMU && fromJson('["ubuntu-24.04", "ubuntu-24.04-arm"]')) || (inputs.BUILD_ARM64 && inputs.USE_QEMU && fromJson('["ubuntu-24.04"]')) || (!inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && !inputs.USE_QEMU && fromJson('["ubuntu-24.04-arm"]')) || fromJson('["ubuntu-24.04"]') }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Set up QEMU (for multi platform build)
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      if: ${{ inputs.USE_QEMU }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ needs.infos.outputs.registry }}
        username: ${{ startsWith(inputs.IMAGE_NAME, 'ghcr.io') && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ startsWith(inputs.IMAGE_NAME, 'ghcr.io') && github.token || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Build and push docker image
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: ${{ inputs.IMAGE_CONTEXT }}
        file: ${{ inputs.IMAGE_DOCKERFILE }}
        target: ${{ inputs.IMAGE_TARGET || '' }}
        provenance: false
        sbom: false
        platforms: ${{ (inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && inputs.USE_QEMU && 'linux/amd64,linux/arm64') || (!inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && inputs.USE_QEMU && 'linux/arm64') || (runner.arch == 'ARM64' && 'linux/arm64') || 'linux/amd64' }}
        outputs: type=image,name=${{ needs.infos.outputs.normalized-image }},push-by-digest=true,name-canonical=true,push=${{ inputs.PUSH_IMAGE }}
        cache-from: ${{ inputs.CACHE && format('type=gha,scope={0}', needs.infos.outputs.lower-image) || '' }}
        cache-to: ${{ inputs.CACHE && format('type=gha,mode=max,scope={0}', needs.infos.outputs.lower-image) || '' }}
        build-args: |
          ${{ inputs.BUILD_ARGS }}

    - name: Export digest
      if: ${{ inputs.PUSH_IMAGE }}
      run: |
        mkdir -p /tmp/digests/${{ needs.infos.outputs.lower-image }}
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${{ needs.infos.outputs.lower-image }}/${digest#sha256:}"

    - name: Upload digest
      if: ${{ inputs.PUSH_IMAGE }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests-${{ needs.infos.outputs.lower-image }}-${{ (inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && inputs.USE_QEMU && 'multiarch') || (!inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && inputs.USE_QEMU && 'arm64') || (runner.arch == 'ARM64' && 'arm64') || 'amd64' }}
        path: /tmp/digests/${{ needs.infos.outputs.lower-image }}/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Merge digest
    if: ${{ inputs.PUSH_IMAGE }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: write
    needs:
    - infos
    - build
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: digests-${{ needs.infos.outputs.lower-image }}-*
        path: /tmp/digests/${{ needs.infos.outputs.lower-image }}
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
      with:
        images: ${{ needs.infos.outputs.normalized-image }}
        tags: |
          type=raw,value=${{ needs.infos.outputs.lower-branch }},enable=${{ github.head_ref != 'main' && github.head_ref != 'develop' }}
          type=raw,value=${{ needs.infos.outputs.short-sha }},enable=${{ needs.infos.outputs.short-sha != '' }}
          type=raw,value=${{ inputs.IMAGE_TAG }},enable=${{ inputs.IMAGE_TAG != '' }}
          type=raw,value=${{ format('{0}.{1}', needs.infos.outputs.major-tag, needs.infos.outputs.minor-tag) }},enable=${{ inputs.TAG_MAJOR_AND_MINOR && needs.infos.outputs.major-tag != '' && needs.infos.outputs.minor-tag != '' && needs.infos.outputs.prerelease-tag == '' }}
          type=raw,value=${{ needs.infos.outputs.major-tag }},enable=${{ inputs.TAG_MAJOR_AND_MINOR && needs.infos.outputs.major-tag != '' && needs.infos.outputs.prerelease-tag == '' }}
          type=raw,value=latest,enable=${{ inputs.LATEST_TAG == true }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ needs.infos.outputs.registry }}
        username: ${{ needs.infos.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ needs.infos.outputs.registry == 'ghcr.io' && github.token || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Create manifest list and push
      working-directory: /tmp/digests/${{ needs.infos.outputs.lower-image }}
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ needs.infos.outputs.normalized-image }}@sha256:%s ' *)

    - name: Get image digest
      if: ${{ inputs.PUSH_IMAGE }}
      id: digest
      run: |
        DIGEST=$(docker buildx imagetools inspect --raw \
          "${{ needs.infos.outputs.normalized-image }}:${{ steps.meta.outputs.version }}" \
          | sha256sum | cut -d' ' -f1)
        echo "value=sha256:${DIGEST}" >> $GITHUB_OUTPUT

    - name: Inspect image
      if: ${{ inputs.PUSH_IMAGE }}
      run: |
        docker buildx imagetools inspect ${{ needs.infos.outputs.normalized-image }}:${{ steps.meta.outputs.version }}
