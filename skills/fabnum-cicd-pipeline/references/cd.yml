# CD template (push to main): release-please, then build and attestation of the image on release.
# Without a GitHub App, the release PR does not trigger CI (see skill fabnum-cicd-auth).
# Pre-release (develop), Helm chart, npm, PyPI, monorepo: see skills fabnum-cicd-release and fabnum-cicd-helm.
name: CD

on:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-app.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      TAG_MAJOR_AND_MINOR: true
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
    - name: Compute image name
      id: vars
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # `release` is idempotent: everything that publishes is guarded by `release-created`.
  build:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
    - release
    - expose-vars
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.image }}
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_DOCKERFILE: ./Dockerfile
      IMAGE_CONTEXT: ./
      TAG_MAJOR_AND_MINOR: true

  # No matrix here: the outputs of a matrix job collapse into a single value.
  attest:
    uses: dnum-mi/fabnum-cicd/.github/workflows/attest-docker.yml@v0
    needs:
    - build
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
