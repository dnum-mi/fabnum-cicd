# Gabarit CD (push sur main) : release-please, puis build et attestation de l'image à la release.
# Sans GitHub App, la PR de release ne déclenche pas la CI (voir le skill fabnum-cicd-auth).
# Pré-release (develop), chart Helm, npm, PyPI, monorepo : voir les skills fabnum-cicd-release et fabnum-cicd-helm.
name: CD

on:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-app.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      TAG_MAJOR_AND_MINOR: true
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
    - name: Compute image name
      id: vars
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # `release` est idempotent : tout ce qui publie est conditionné à `release-created`.
  build:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
    - release
    - expose-vars
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.image }}
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_DOCKERFILE: ./Dockerfile
      IMAGE_CONTEXT: ./
      TAG_MAJOR_AND_MINOR: true

  # Pas de matrice ici : les sorties d'un job matricé s'effondrent en une seule valeur.
  attest:
    uses: dnum-mi/fabnum-cicd/.github/workflows/attest-docker.yml@v0
    needs:
    - build
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
