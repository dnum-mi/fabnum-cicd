# CI template (pull request) for an application repository with a Docker image.
# Replace the <…>, remove the jobs that do not apply, and keep `all-jobs-passed` up to date.
# Exact inputs, secrets and permissions: workflows.md and docs/workflows/NN-<name>.md.
name: CI

on:
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Compute the lowercase image name and the PR tag once.
  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
    - name: Compute image name and tag
      id: vars
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |-
        echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

  lint-commits:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-commits.yml@v0
    permissions:
      contents: read

  scan-zizmor:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-zizmor.yml@v0
    permissions:
      contents: read

  scan-gitleaks:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-gitleaks.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  build:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
    - expose-vars
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.image }}
      IMAGE_TAG: ${{ needs.expose-vars.outputs.tag }}
      IMAGE_DOCKERFILE: ./Dockerfile
      IMAGE_CONTEXT: ./
      LATEST_TAG: false

  scan-trivy:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
    - expose-vars
    - build
    permissions:
      contents: read
      packages: read
      security-events: write
      pull-requests: write
    with:
      IMAGE: ${{ needs.expose-vars.outputs.image }}:${{ needs.expose-vars.outputs.tag }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

  # The only check to require in the ruleset. List ALL the jobs above.
  all-jobs-passed:
    name: Check jobs status
    if: ${{ always() }}
    needs:
    - expose-vars
    - lint-commits
    - scan-zizmor
    - scan-gitleaks
    - build
    - scan-trivy
    uses: dnum-mi/fabnum-cicd/.github/workflows/check-jobs.yml@v0
    permissions: {}
    with:
      NEEDS: ${{ toJson(needs) }}
